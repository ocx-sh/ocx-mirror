# yaml-language-server: $schema=https://squidfunk.github.io/mkdocs-material/schema.json

site_name: ocx-mirror
site_description: "Mirror upstream tool releases into OCI registries as OCX packages"
site_url: https://ocx-sh.github.io/ocx-mirror/
repo_url: https://github.com/ocx-sh/ocx-mirror
edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.footer
    - content.code.copy
    - toc.follow

# The site's Bazel build and its pinned toolchain live beside the pages
# (docs/BUILD.bazel); mkdocs would otherwise publish them as static files.
exclude_docs: |
  BUILD.bazel
  mkdocs_bazel.py
  requirements.in
  requirements.lock

# A `[text](page.md#anchor)` whose anchor no page renders is a broken link
# the reader only finds by clicking; surface it so `--strict` fails the build.
validation:
  anchors: warn

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      check_paths: true

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Reference:
      - mirror.yml: reference/mirror-yml.md
      - registry.yml: reference/registry-yml.md
      - dist.yml: reference/dist-yml.md
      - CLI: reference/cli.md
      - plan.json: reference/plan-json.md
      - Environment: reference/environment.md
  - Contributing: contributing.md
  - Changelog: changelog.md
