name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'announce/**']
  # release.yml reuses this workflow as its quality gate on the tag.
  workflow_call: {}

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  conventional-commits:
    name: Conventional Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Check conventional commits
        uses: cocogitto/cocogitto-action@52d0023b4396897f1815648e553db2ab8d782f3a # v4.2.0
        with:
          command: check
          args: "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

  smoke:
    name: Smoke (Linux)
    runs-on: ubuntu-latest
    env:
      # Test telemetry (adr_bazel_crate_split.md § A-8): whether the credential
      # exists, for the push step's `if:` — `secrets` is not a context `if:`
      # can see. False on a fork PR, and the push skips rather than fails. The
      # credential itself is that step's `env:` alone, never the whole job's.
      OTEL_ON: ${{ secrets.OTEL_OTLP_AUTH != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Nested: external/ocx itself carries the fork submodules the
          # [patch.crates-io] table points at.
          submodules: recursive
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          matcher: true
          # Defer warning-denial to [lints.rust]. The action's default
          # RUSTFLAGS=-D warnings is global and also denies the path-vendored
          # forks (Cargo auto-caps registry/git deps, not path deps).
          rustflags: ""
      - name: Rust Cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # The submodule `ocx` build below has its own workspace + target dir.
          workspaces: |
            . -> target
            external/ocx -> target
      - name: Setup Task
        uses: go-task/setup-task@01a4adf9db2d14c1de7a560f09170b6e0df736aa # v2.1.0
      - name: Install nextest
        uses: taiki-e/install-action@65851e10cd6c377f11a60e600abc07cb08643468 # v2.79.3
        with:
          tool: cargo-nextest
      - name: Verify fork patches bind
        # Dropping the [patch.crates-io] table does NOT error — cargo would
        # silently resolve the unpatched crates.io releases. Assert the fork
        # path source is in the graph.
        run: |
          for fork in oci-client:rust-oci-client sigstore:sigstore-rs; do
            cargo tree -i "${fork%%:*}" --locked | head -1 | grep -F "external/ocx/external/${fork#*:}" \
              || { echo "::error::${fork%%:*} does not resolve to the vendored fork — [patch.crates-io] broken"; exit 1; }
          done
      - name: Check formatting
        id: fmt
        run: task rust:format:check
        continue-on-error: true
      - name: Clippy
        id: clippy
        run: task rust:clippy:check
        continue-on-error: true
      - name: Check jsonschema feature
        # The `schema` command and every `schemars` derive are feature-gated,
        # so nothing else here compiles them — a broken derive stayed green
        # until someone ran `ocx-mirror schema` by hand.
        run: task rust:jsonschema:check
      - name: Build
        run: task rust:build
      - name: Test
        # nextest by name: `rust:test:unit` dispatches to Bazel on Linux, and
        # CI's unit lane stays cargo (adr_bazel_crate_split.md § C8, C11).
        run: task rust:test:nextest -- --profile ci
      - name: Upload Binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ocx-mirror-binary
          path: target/release/ocx-mirror
          compression-level: 0
          retention-days: 1
      - name: Build ocx (submodule pin)
        # The acceptance job's checkout is `submodules: true`, not recursive,
        # so it cannot build `ocx` itself (empty external/ocx/external/* =
        # dangling [patch.crates-io]). This job can — its checkout is
        # submodules:recursive — and the mount-
        # dependent acceptance tests need an `ocx` at the exact submodule pin,
        # not whatever release setup-ocx installs.
        run: cargo build --release --bin ocx
        working-directory: external/ocx
      - name: Upload ocx Binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ocx-submodule-binary
          path: external/ocx/target/release/ocx
          compression-level: 0
          retention-days: 1
      - name: Publish Unit Test Results
        if: ${{ !cancelled() }}
        uses: EnricoMi/publish-unit-test-result-action@c950f6fb443cb5af20a377fd0dfaa78838901040 # v2.23.0
        with:
          files: target/nextest/ci/junit.xml
          check_name: "Unit Test Results"
      - name: Push unit test timings
        if: ${{ !cancelled() && env.OTEL_ON == 'true' }}
        continue-on-error: true
        timeout-minutes: 5
        uses: ./.github/actions/test-telemetry
        env:
          # The composite action reads it from the environment.
          OTEL_OTLP_AUTH: ${{ secrets.OTEL_OTLP_AUTH }}
        with:
          junit: target/nextest/ci/junit.xml
          suite: unit
      - name: Check lint results
        if: ${{ !cancelled() }}
        run: |
          if [[ "${{ steps.fmt.outcome }}" == "failure" || "${{ steps.clippy.outcome }}" == "failure" ]]; then
            echo "::error::Lint checks failed (fmt=${{ steps.fmt.outcome }}, clippy=${{ steps.clippy.outcome }})"
            exit 1
          fi

  acceptance-tests:
    name: Acceptance Tests
    needs: smoke
    runs-on: ubuntu-latest
    env:
      # Test telemetry, for `Push acceptance test timings` — see `smoke`.
      OTEL_ON: ${{ secrets.OTEL_OTLP_AUTH != '' }}
    services:
      registry:
        image: registry:2
        ports:
          - 5001:5000
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # The keyless-signing tier needs ocx's Sigstore compose file and the
          # config, keys and trusted root beside it (external/ocx/test/) — all
          # tracked in ocx itself, so one level is enough. Deliberately NOT
          # `recursive`: ocx's own submodules are Rust fork patches this job
          # never builds, and leaving them empty keeps the `real_ocx_binary`
          # fixture's cargo-build fallback correctly unreachable (it is, in
          # any case, short-circuited by OCX_TEST_BINARY below).
          submodules: true
      - name: Download Binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ocx-mirror-binary
          path: test/bin
      - name: Download ocx Binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ocx-submodule-binary
          path: test/bin
      - name: Prepare Binary
        run: chmod +x test/bin/ocx-mirror test/bin/ocx
      - name: Setup OCX
        # Activates the project toolchain (task, uv, …) from ocx.lock. The
        # `ocx` the acceptance tier drives is the submodule build under
        # OCX_COMMAND below, not this one. Bump the version alongside
        # external/ocx submodule bumps once the release exists. Must stay >=
        # the ocx that wrote ocx.lock: setup-ocx runs `ocx pull` against it,
        # and an older binary exits 78 on a newer lock_version.
        uses: ocx-sh/setup-ocx@de8e3366f812941423985eaccae28663ef192e8b # v1.3.0
        with:
          version: "0.6.2"
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - name: Setup Task
        uses: go-task/setup-task@01a4adf9db2d14c1de7a560f09170b6e0df736aa # v2.1.0
      - name: Telemetry self-test
        run: task telemetry:self-test
      - name: Run Acceptance Tests
        run: task test:parallel -- --junit-xml=results/junit.xml
        env:
          OCX_MIRROR_COMMAND: ${{ github.workspace }}/test/bin/ocx-mirror
          # Submodule-pin ocx for the whole acceptance tier: the harness's
          # own `ocx` calls and — via `OCX_BINARY_PIN`, which `MirrorRunner`
          # derives from this — every `ocx` the mirror under test spawns.
          # The setup-ocx `ocx` above activates the toolchain; it is a
          # *release*, and the mirror's subprocess contract (cascade
          # `--tags-file`, the positional announce package) moves with the
          # submodule, ahead of the release that ships it.
          OCX_COMMAND: ${{ github.workspace }}/test/bin/ocx
          # The same binary for the mount-dependent tests (see the smoke
          # job's "Build ocx" step); the `real_ocx_binary` fixture prefers it
          # over a local cargo build, which cannot work in this checkout.
          OCX_TEST_BINARY: ${{ github.workspace }}/test/bin/ocx
          # Without this the keyless tier looks for a *sibling* ../ocx
          # checkout, which CI does not have, and all 14 signing acceptance
          # tests skip — a green check that tested none of the feature. The
          # submodule's copy is the same file the sibling provides, at the
          # pin this branch builds against. `pytest_sessionstart` brings the
          # stack up by explicit service name, so ocx's own registries (5000,
          # 5001, 5003, 5004) are never started and cannot contend with the
          # `registry` service container on 5001.
          OCX_SIGSTORE_COMPOSE: ${{ github.workspace }}/external/ocx/test/docker-compose.yml
      - name: Publish Acceptance Test Results
        if: ${{ !cancelled() }}
        uses: EnricoMi/publish-unit-test-result-action@c950f6fb443cb5af20a377fd0dfaa78838901040 # v2.23.0
        with:
          files: test/results/junit.xml
          check_name: "Acceptance Test Results"
      - name: Push acceptance test timings
        if: ${{ !cancelled() && env.OTEL_ON == 'true' }}
        continue-on-error: true
        timeout-minutes: 5
        uses: ./.github/actions/test-telemetry
        env:
          OTEL_OTLP_AUTH: ${{ secrets.OTEL_OTLP_AUTH }}
        with:
          junit: test/results/junit.xml
          suite: acceptance

  bazel-graph:
    # adr_bazel_crate_split.md § C8 "Light CI job": keeps the Bazel graph from
    # rotting under either C11 verdict. Analysis only — no compile, no test;
    # the unit and acceptance lanes above stay cargo.
    name: Bazel graph (Linux)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # The [patch.crates-io] forks live in external/ocx's own submodules;
          # crate_universe splices them from there (`bazel:patch:check`).
          submodules: recursive
      - name: Setup OCX
        # `ocx exec bazel` (ocx.toml's bazel row) runs every Bazel command.
        uses: ocx-sh/setup-ocx@de8e3366f812941423985eaccae28663ef192e8b # v1.3.0
        with:
          version: "0.6.2"
      - name: Setup Task
        uses: go-task/setup-task@01a4adf9db2d14c1de7a560f09170b6e0df736aa # v2.1.0
      - name: Bazel repository cache
        # Analysis fetches every @crates source and the git_override clone;
        # the repository cache (and the repo contents cache under it) makes a
        # warm run local. Keyed on the two lockfiles that decide its contents.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ocx-mirror/bazel-repo
          key: bazel-repo-${{ runner.os }}-${{ hashFiles('MODULE.bazel.lock', 'Cargo.lock') }}
          restore-keys: bazel-repo-${{ runner.os }}-
      - name: Gate script self-tests
        # Python only; CI does not run `task verify`, so the five gate scripts'
        # self-tests would otherwise run on developer machines alone.
        run: task scripts:self-test
      - name: Bazel static gates
        # No explicit bazel:bootstrap: every Bazel gate below runs it, and
        # `run: once` makes that one bootstrap per invocation.
        run: task bazel:pin:check bazel:lint bazel:mod:check bazel:patch:check bazel:build:drift JOBS=auto
      # Per-target analysis timings to otel.ocx.sh are pushed from inside this
      # step, by `telemetry:bazel` at the tail of `bazel:build:nobuild`. The
      # BEP holds the whole client environment, so it lives in a 0700 mktemp
      # outside the workspace, removed by a `defer:`; there is no file for a
      # separate step to read. The endpoint is empty on a fork PR, which is the
      # whole guard (`telemetry:bazel` exits 0 silently with no endpoint) — no
      # `if:`, since this step is a gate. The credential is a step `env:`
      # entry, never interpolated into `run:`, and the taskfile's `{{.BAZEL}}`
      # drops it from the Bazel client environment (the BEP, repository rules).
      - name: Bazel graph loads
        env:
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.OTEL_OTLP_AUTH != '' && 'https://otel.ocx.sh' || '' }}
          OTEL_EXPORTER_OTLP_HEADERS: Authorization=${{ secrets.OTEL_OTLP_AUTH }}
        run: task bazel:build:nobuild JOBS=auto
