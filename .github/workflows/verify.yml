name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'announce/**']
  # release.yml reuses this workflow as its quality gate on the tag.
  workflow_call:
    # A called workflow sees only the secrets its caller maps; every secret
    # this file names is declared, all optional. release.yml maps the READ
    # credential alone: the tag run reads the shared cache and never writes
    # it — under `workflow_call` the write-lane expression is false anyway
    # (`github.workflow` is the caller's).
    secrets:
      BAZEL_CACHE_READ_AUTH:
        required: false
      BAZEL_CACHE_WRITE_AUTH:
        required: false
      OTEL_OTLP_AUTH:
        required: false

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  conventional-commits:
    name: Conventional Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Check conventional commits
        uses: cocogitto/cocogitto-action@52d0023b4396897f1815648e553db2ab8d782f3a # v4.2.0
        with:
          command: check
          args: "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

  smoke:
    # The one Linux job, cargo lint then every Bazel lane — ocx's
    # verify-basic.yml `smoke` shape (fmt/clippy on cargo, then the Bazel
    # gates and `bazel test`), plus the acceptance suite ocx runs in
    # verify-deep.yml. One job, so the Bazel server, the output base and the
    # credential are set up once, and the write lane is exactly one job.
    name: Smoke (Linux)
    runs-on: ubuntu-latest
    env:
      # Test telemetry (adr_bazel_crate_split.md § A-8): whether the credential
      # exists, for the push steps' `if:` — `secrets` is not a context `if:`
      # can see. False on a fork PR, and the push skips rather than fails. The
      # credential itself is those steps' `env:` alone, never the whole job's.
      OTEL_ON: ${{ secrets.OTEL_OTLP_AUTH != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Nested: external/ocx itself carries the fork submodules the
          # [patch.crates-io] table points at, and crate_universe splices them
          # from there (`bazel:patch:check`).
          submodules: recursive
      # --- cargo: only what ocx's smoke job also keeps on cargo -------------
      # ocx verify-basic.yml:157-163 runs `rust:format:check` and
      # `rust:clippy:check` on cargo beside its Bazel lane (no rules_rust
      # clippy aspect, no Bazel rustfmt), and :521 keeps `schema:generate` on
      # cargo — the jsonschema feature check below is that line's twin. The
      # release build, nextest, and the ocx submodule build are gone: Bazel
      # builds //:ocx-mirror and runs both test lanes below.
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          matcher: true
          # Defer warning-denial to [lints.rust]. The action's default
          # RUSTFLAGS=-D warnings is global and also denies the path-vendored
          # forks (Cargo auto-caps registry/git deps, not path deps).
          rustflags: ""
      - name: Rust Cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # clippy and the jsonschema check only; nothing builds external/ocx
          # with cargo any more.
          workspaces: . -> target
      - name: Setup Task
        uses: go-task/setup-task@01a4adf9db2d14c1de7a560f09170b6e0df736aa # v2.1.0
      - name: Verify fork patches bind
        # Mirror-only, no ocx twin: the [patch.crates-io] re-declaration exists
        # only here (patches do not travel with path deps), and the release
        # binaries stay cargo-built (build-matrix.yml, as ocx's release.yml),
        # so the cargo graph is still what ships. Dropping the table does NOT
        # error — cargo would silently resolve the unpatched crates.io
        # releases. A lockfile read, no compile; `bazel:patch:check` below is
        # the same assertion on the Bazel graph.
        run: |
          for fork in oci-client:rust-oci-client sigstore:sigstore-rs; do
            cargo tree -i "${fork%%:*}" --locked | head -1 | grep -F "external/ocx/external/${fork#*:}" \
              || { echo "::error::${fork%%:*} does not resolve to the vendored fork — [patch.crates-io] broken"; exit 1; }
          done
      - name: Check formatting
        id: fmt
        run: task rust:format:check
        continue-on-error: true
      - name: Clippy
        id: clippy
        run: task rust:clippy:check
        continue-on-error: true
      - name: Check jsonschema feature
        # The `schema` command and every `schemars` derive are feature-gated,
        # so nothing else here compiles them — a broken derive stayed green
        # until someone ran `ocx-mirror schema` by hand.
        run: task rust:jsonschema:check
      # --- Bazel ---------------------------------------------------------------
      - name: Setup OCX
        # `ocx exec bazel` (ocx.toml's bazel row) runs every Bazel command, and
        # activates the project toolchain from ocx.lock. The `ocx` the
        # acceptance suite drives is `@tools//:ocx`, the ocx.lock pin, not this
        # one. Must stay >= the ocx that wrote ocx.lock: setup-ocx runs
        # `ocx pull` against it, and an older binary exits 78 on a newer
        # lock_version.
        uses: ocx-sh/setup-ocx@de8e3366f812941423985eaccae28663ef192e8b # v1.3.0
        with:
          version: "0.6.2"
      - name: Install uv
        # `telemetry:self-test` is `uv run --project test pytest`. The
        # acceptance runner brings its own (`@tools//:uv`).
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - name: Bazel repository cache
        # Analysis fetches every @crates source and the git_override clone;
        # the repository cache (and the repo contents cache under it) makes a
        # warm run local. Keyed on the two lockfiles that decide its contents.
        # Not the disk cache: ocx measured it (measurement_bazel_r2.md § 5c) —
        # 2 GiB and churning against the 10 GiB per-repo cap, and the remote
        # cache is what persists build outputs across runs.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ocx-mirror/bazel-repo
          key: bazel-repo-${{ runner.os }}-${{ hashFiles('MODULE.bazel.lock', 'Cargo.lock') }}
          restore-keys: bazel-repo-${{ runner.os }}-
      - name: Gate script self-tests
        # Python and bash only, no Bazel; includes the bazel-cache-rc action's
        # selftest.sh.
        run: task scripts:self-test
      - name: Telemetry self-test
        run: task telemetry:self-test
      # The shared cache's credential, ported from ocx verify-basic.yml `smoke`
      # (its comment block carries the full reasoning; the points it rests on):
      #
      # * **One credential source per lane.** Bazel sends an `Authorization`
      #   header per configured source, so the two bindings are one gate read
      #   twice, one of them negated: the `main` push presents the write
      #   credential alone (its user is in both realms), every other trigger
      #   the read credential alone. `write_rc.py` refuses both at once.
      # * **The truthy branch carries the secret in both.** GitHub's
      #   `a && b || c` yields `c` whenever `b` is falsy, so a binding written
      #   `<trusted> && '' || secrets.READ` would hand the read secret to the
      #   `main` push.
      # * A **fork** PR is given no secrets: both bindings are empty, the
      #   action writes nothing, `{{.BAZEL}}` omits `--bazelrc`, and the lane
      #   compiles over `--disk_cache` alone — silently, by design.
      #
      # **The write-lane expression, used verbatim for the credential here and
      # the upload grant on both test steps:**
      #
      #   github.event_name == 'push' && github.ref == 'refs/heads/main'
      #     && github.workflow == 'Verify'
      #
      # The first two terms are ocx's ADR ruling 5. The third is the mirror's:
      # this file is also a `workflow_call` target (release.yml), and under
      # `workflow_call` the whole `github` context is the CALLER's (ocx ruling
      # 5a) — a caller triggered by a `main` push would satisfy the first two
      # and write through this job. `github.workflow` is then the caller's
      # name, never `Verify`. ocx needs no third term: its write lane lives in
      # verify-basic.yml, which nothing calls.
      - name: Bazel cache credential
        uses: ./.github/actions/bazel-cache-rc
        with:
          read-auth: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main' && github.workflow == 'Verify') && secrets.BAZEL_CACHE_READ_AUTH || '' }}
          write-auth: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main' && github.workflow == 'Verify') && secrets.BAZEL_CACHE_WRITE_AUTH || '' }}
      # Ahead of every Bazel command, because the C++ toolchain is
      # autoconfigured on first use, once per output base: `rules_cc` probes
      # `lld` then `gold` and bakes the winner in as `-fuse-ld=`. The runner
      # image has gold and no unversioned `ld.lld`, so without this every link
      # took gold (rustc warns it miscompiles). ocx installs it on every Bazel
      # lane for the reason that matters here too: the lanes share one remote
      # cache — ocx's and this repository's — and a linker difference is a
      # different action key for every link.
      - name: Install lld
        run: sudo apt-get update && sudo apt-get install -y lld
      - name: Bazel static gates
        # No explicit bazel:bootstrap: every Bazel gate below runs it, and
        # `run: once` makes that one bootstrap per invocation.
        run: task bazel:pin:check bazel:lint bazel:mod:check bazel:patch:check bazel:build:drift bazel:tag:guard JOBS=auto
      # Per-target analysis timings to otel.ocx.sh are pushed from inside this
      # step, by `telemetry:bazel` at the tail of `bazel:build:nobuild`. The
      # BEP holds the whole client environment, so it lives in a 0700 mktemp
      # outside the workspace, removed by a `defer:`; there is no file for a
      # separate step to read. The endpoint is empty on a fork PR, which is the
      # whole guard (`telemetry:bazel` exits 0 silently with no endpoint) — no
      # `if:`, since this step is a gate. The credential is a step `env:`
      # entry, never interpolated into `run:`, and the taskfile's `{{.BAZEL}}`
      # drops it from the Bazel client environment (the BEP, repository rules).
      - name: Bazel graph loads
        env:
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.OTEL_OTLP_AUTH != '' && 'https://otel.ocx.sh' || '' }}
          OTEL_EXPORTER_OTLP_HEADERS: Authorization=${{ secrets.OTEL_OTLP_AUTH }}
        run: task bazel:build:nobuild JOBS=auto
      # Execution logs (goal decision D5): only the `main` push writes, so a
      # branch run cannot show a cache hit — but two runs on one tree can show
      # they asked for identical action keys. Each test step below writes
      # `--execution_log_compact_file` here: under $RUNNER_TEMP, outside the
      # `target/` Swatinem/rust-cache saves, 0700 like the BEP scratch. The log
      # records spawns (argv, action env, digests), never Bazel's own flags, so
      # no `--remote_header` value reaches it (checked on a local log against
      # the host rc's header).
      - name: Execution-log scratch
        run: install -d -m 700 "$RUNNER_TEMP/bazel-execlog"
      # `--config=ci` (.bazelrc): `--remote_download_minimal` plus the
      # test.xml|test.log regex, so a fully cached second run downloads the
      # reports and nothing else. ocx carries the block latent; this lane
      # wires it. `bazel_test_floor.py` reads test.log off the BEP's file URIs,
      # which the regex keeps local.
      #
      # **The upload grant**, the write-lane expression above: a command-line
      # build option outranks the committed `--remote_upload_local_results=false`,
      # and it rides `{{.CLI_ARGS}}`, which the task appends after the command
      # word. Everywhere else it is the empty string, so the credential and the
      # grant are absent together or present together.
      - name: Unit tests (Bazel)
        run: >-
          task bazel:test:unit JOBS=auto --
          --config=ci
          --execution_log_compact_file="$RUNNER_TEMP/bazel-execlog/unit.zst"
          ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main' && github.workflow == 'Verify') && '--remote_upload_local_results=true' || '' }}
      # `target/bazel/junit.xml` — the per-case report `bazel:test:unit` writes
      # off the same test.log files its floor reads. Bazel's own test.xml has
      # one testcase per target. `!cancelled()`: a failing suite still writes
      # it, and naming the red tests is what the check is for.
      - name: Publish Unit Test Results
        if: ${{ !cancelled() }}
        uses: EnricoMi/publish-unit-test-result-action@c950f6fb443cb5af20a377fd0dfaa78838901040 # v2.23.0
        with:
          files: target/bazel/junit.xml
          check_name: "Unit Test Results"
      - name: Push unit test timings
        if: ${{ !cancelled() && env.OTEL_ON == 'true' }}
        continue-on-error: true
        timeout-minutes: 5
        uses: ./.github/actions/test-telemetry
        env:
          # The composite action reads it from the environment.
          OTEL_OTLP_AUTH: ${{ secrets.OTEL_OTLP_AUTH }}
        with:
          junit: target/bazel/junit.xml
          suite: unit
      # `//test:acceptance`: pytest against the Bazel-built ocx-mirror and the
      # ocx.lock-pinned `@tools//:ocx`, results cached. The harness starts its
      # own registries and the Sigstore stack through docker compose
      # (`pytest_sessionstart`), so no `services:` container is needed. Same
      # `--config=ci`, execution log and upload grant as the unit step.
      - name: Acceptance tests (Bazel)
        run: >-
          task bazel:test:accept JOBS=auto --
          --config=ci
          --execution_log_compact_file="$RUNNER_TEMP/bazel-execlog/accept.zst"
          ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main' && github.workflow == 'Verify') && '--remote_upload_local_results=true' || '' }}
      # The per-case pytest JUnit the runner writes to $XML_OUTPUT_FILE, copied
      # out of bazel-testlogs by the task (`--config=ci`'s regex keeps it on
      # disk on a cache hit too).
      - name: Publish Acceptance Test Results
        if: ${{ !cancelled() }}
        uses: EnricoMi/publish-unit-test-result-action@c950f6fb443cb5af20a377fd0dfaa78838901040 # v2.23.0
        with:
          files: target/bazel/accept/junit.xml
          check_name: "Acceptance Test Results"
      - name: Push acceptance test timings
        if: ${{ !cancelled() && env.OTEL_ON == 'true' }}
        continue-on-error: true
        timeout-minutes: 5
        uses: ./.github/actions/test-telemetry
        env:
          OTEL_OTLP_AUTH: ${{ secrets.OTEL_OTLP_AUTH }}
        with:
          junit: target/bazel/accept/junit.xml
          suite: acceptance
      # `//docs:site` (docs/BUILD.bazel): mkdocs --strict, sandboxed and
      # offline over the hashed docs/requirements.lock, so the archive lives on
      # the shared cache like any test result — and docs.yml, which only reads,
      # deploys what this lane wrote. Same `--config=ci`, execution log and
      # upload grant as the two test steps.
      - name: Docs site (Bazel)
        run: >-
          task docs:build JOBS=auto --
          --config=ci
          --execution_log_compact_file="$RUNNER_TEMP/bazel-execlog/site.zst"
          ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main' && github.workflow == 'Verify') && '--remote_upload_local_results=true' || '' }}
      # One sorted `<label> <mnemonic> <digest>` line per spawn, per log: the
      # diff of two runs' files is the action-key comparison. Evidence only —
      # never the job's verdict.
      - name: Execution-log action keys
        if: always()
        continue-on-error: true
        run: |
          for log in "$RUNNER_TEMP"/bazel-execlog/*.zst; do
            [ -e "$log" ] || continue
            python3 scripts/bazel_execlog_keys.py --log "$log" --out "${log%.zst}.keys.tsv"
          done
      - name: Upload execution logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bazel-execlog
          path: ${{ runner.temp }}/bazel-execlog/
          retention-days: 7
          if-no-files-found: warn
      - name: Check lint results
        if: ${{ !cancelled() }}
        run: |
          if [[ "${{ steps.fmt.outcome }}" == "failure" || "${{ steps.clippy.outcome }}" == "failure" ]]; then
            echo "::error::Lint checks failed (fmt=${{ steps.fmt.outcome }}, clippy=${{ steps.clippy.outcome }})"
            exit 1
          fi
      # A composite action has no `post:` hook, so the deletion is this file's
      # obligation. `always()`: a cancelled or failed job is exactly the one
      # that would otherwise leave the credential on the runner.
      - name: Remove the Bazel cache credential
        if: always()
        uses: ./.github/actions/bazel-cache-rc
        with:
          cleanup: 'true'
