name: Build Targets

# Reusable 6-target build matrix shared by deploy-dev.yml (rolling dev
# publishes) and release.yml (tag-driven releases) — one build path, zero
# dev/release drift. Uploads one bare-binary artifact per target named
# `ocx-mirror-<target>`.

on:
  workflow_call:
    inputs:
      version_semver:
        description: SemVer build version, baked in as `__OCX_BUILD_VERSION`
          (what `ocx-mirror version` prints).
        required: true
        type: string
      channel:
        description: Build channel baked into the binary (`dev`, `release`, or
          `check` for build-check.yml's never-published builds).
        required: true
        type: string
    secrets:
      BAZEL_CACHE_READ_AUTH:
        description: The shared Bazel cache's read credential (the Linux legs).
          Optional — without it they build cold.
        required: false

permissions:
  contents: read

jobs:
  build-linux:
    # Bazel (`task bazel:build:release`): //:ocx-mirror for the target's
    # //platforms triple — rustc + zig's musl through hermetic_cc_toolchain,
    # static, with build.rs's real provenance read by
    # release/workspace_status.py from this job's environment (the two
    # `__OCX_BUILD_*` below, CI, GITHUB_*). Both triples cross-compile on the
    # x86_64 runner; the aarch64 smoke runs under qemu-aarch64.
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    env:
      __OCX_BUILD_VERSION: ${{ inputs.version_semver }}
      __OCX_BUILD_CHANNEL: ${{ inputs.channel }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          persist-credentials: false
      - name: Setup Task
        uses: go-task/setup-task@01a4adf9db2d14c1de7a560f09170b6e0df736aa # v2.1.0
      - name: Setup OCX
        # `ocx exec bazel` (ocx.toml's bazel row) runs Bazel; the smoke's
        # `ocx package create` is this binary too. The same pin as verify.yml
        # and oci-publish.yml.
        uses: ocx-sh/setup-ocx@de8e3366f812941423985eaccae28663ef192e8b # v1.3.0
        with:
          version: "0.6.2"
      # Read-only, on every caller: a build here never writes the shared
      # cache (the upload grant is verify.yml's `main` push alone, C3), and
      # the one action that reads the workspace status is `no-remote-cache`
      # besides. The read credential only hits third-party and exec-tool
      # compiles; a caller that maps no secret builds cold.
      - name: Bazel cache credential
        uses: ./.github/actions/bazel-cache-rc
        with:
          read-auth: ${{ secrets.BAZEL_CACHE_READ_AUTH }}
      # verify.yml's reason: the host C toolchain (build scripts, proc
      # macros) autoconfigures `-fuse-ld=` from what it finds, and the same
      # linker keeps those exec compiles on verify.yml's cache keys.
      - name: Install lld and qemu
        run: sudo apt-get update && sudo apt-get install -y lld qemu-user
      - name: Build
        env:
          TARGET: ${{ matrix.target }}
        run: task bazel:build:release TARGET="$TARGET" JOBS=auto
      - name: Smoke
        # Provenance is the requested channel and version and this commit,
        # clean; the run URL is this run's; the binary is static;
        # `ocx package create` takes it as oci-publish.yml will. The caller's
        # inputs arrive through `env`, never spliced into the script.
        env:
          TARGET: ${{ matrix.target }}
        run: >-
          task release:smoke
          BIN="target/bazel/release/ocx-mirror-$TARGET"
          TARGET="$TARGET"
          CHANNEL="$__OCX_BUILD_CHANNEL"
          VERSION="$__OCX_BUILD_VERSION"
          SHA="$GITHUB_SHA"
      - name: Upload Binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ocx-mirror-${{ matrix.target }}
          path: target/bazel/release/ocx-mirror-${{ matrix.target }}
          compression-level: 0
          retention-days: 1

  build-darwin:
    name: Build (${{ matrix.target }})
    runs-on: macos-latest
    env:
      __OCX_BUILD_VERSION: ${{ inputs.version_semver }}
      __OCX_BUILD_CHANNEL: ${{ inputs.channel }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-apple-darwin
          - aarch64-apple-darwin
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          persist-credentials: false
      - name: Build
        uses: ./.github/actions/build-rust
        with:
          target: ${{ matrix.target }}

  build-windows:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    env:
      __OCX_BUILD_VERSION: ${{ inputs.version_semver }}
      __OCX_BUILD_CHANNEL: ${{ inputs.channel }}
    container:
      # messense/cargo-xwin has no stable versioned tag — pinned by digest. Re-pin with:
      #   docker pull messense/cargo-xwin && docker inspect --format='{{index .RepoDigests 0}}' messense/cargo-xwin
      image: messense/cargo-xwin@sha256:543cdaeb5cd3ed0ca1dd29b9e5aba4100aa0008f8ed088b793f3b9255a635869
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-pc-windows-msvc
          - aarch64-pc-windows-msvc
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install Rust target
        shell: bash
        run: rustup target add ${{ matrix.target }}
      - name: Build
        shell: bash
        run: cargo xwin build --release --target=${{ matrix.target }} --locked
      - name: Prepare Binary
        shell: bash
        run: cp target/${{ matrix.target }}/release/ocx-mirror.exe ocx-mirror-${{ matrix.target }}.exe
      - name: Upload Binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ocx-mirror-${{ matrix.target }}
          path: ocx-mirror-${{ matrix.target }}.exe
          compression-level: 0
          retention-days: 1
