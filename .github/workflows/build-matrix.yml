name: Build Targets

# Reusable 6-target build matrix shared by release.yml (every mode)
# and deep-repo.yml — one build path, zero
# dev/release drift. Uploads one bare-binary artifact per target named
# `ocx-mirror-<target>`.

on:
  workflow_call:
    inputs:
      version_semver:
        description: SemVer build version, baked in as `__OCX_BUILD_VERSION`
          (what `ocx-mirror version` prints).
        required: true
        type: string
      channel:
        description: Build channel baked into the binary (`dev`, `release`, or
          `check` for deep-repo.yml's never-published builds).
        required: true
        type: string
      ref:
        description: Commit to check out and build; empty means the default for the triggering event (`github.sha`).
        type: string
        default: ''
    secrets:
      BAZEL_CACHE_READ_AUTH:
        description: The shared Bazel cache's read credential. Optional —
          without it every leg builds cold.
        required: false

permissions:
  contents: read

jobs:
  build:
    # Every triple cross-builds on one x86_64 Linux runner (`task
    # bazel:build:release`): rustc through rules_rs and the hermetic llvm
    # toolchain, with build.rs's real provenance read by
    # release/workspace_status.py from this job's environment (the two
    # `__OCX_BUILD_*` below, CI, GITHUB_*). The Linux triples smoke here (the
    # aarch64 one under qemu-aarch64); the darwin and windows ones smoke on a
    # native runner below, from this job's artifact.
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    env:
      __OCX_BUILD_VERSION: ${{ inputs.version_semver }}
      __OCX_BUILD_CHANNEL: ${{ inputs.channel }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - x86_64-apple-darwin
          - aarch64-apple-darwin
          - x86_64-pc-windows-gnullvm
          - aarch64-pc-windows-gnullvm
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref }}
          submodules: recursive
          persist-credentials: false
      - name: Setup Task
        uses: go-task/setup-task@01a4adf9db2d14c1de7a560f09170b6e0df736aa # v2.1.0
      - name: Setup OCX
        # `ocx exec bazel` (ocx.toml's bazel row) runs Bazel; the smoke's
        # `ocx package create` is this binary too. The same ocx floor as the baseline setup action
        # and release.yml's publish.
        uses: ocx-sh/setup-ocx@25fa771f8572572dc64528db89560de68a163a0e # v1.4.0
        with:
          version: "0.6.6"
      # Read-only, on every caller: a build here never writes the shared
      # cache (the upload grant is `verify-basic.yml`'s trusted lane alone, C3), and
      # the one action that reads the workspace status is `no-remote-cache`
      # besides. The read credential only hits third-party and exec-tool
      # compiles; a caller that maps no secret builds cold.
      - name: Bazel cache credential
        uses: ./.github/actions/bazel-cache-rc
        with:
          read-auth: ${{ secrets.BAZEL_CACHE_READ_AUTH }}
      - name: Bazel cache credential reaches Bazel
        shell: bash
        run: task bazel:cache:rc:check
      # basic-repo.yml's reason: the host C toolchain (build scripts, proc
      # macros) autoconfigures `-fuse-ld=` from what it finds, and the same
      # linker keeps those exec compiles on basic-repo.yml's cache keys.
      - name: Install lld and qemu
        run: sudo apt-get update && sudo apt-get install -y lld qemu-user
      - name: Build
        env:
          TARGET: ${{ matrix.target }}
        run: task bazel:build:release TARGET="$TARGET" JOBS=auto
      - name: Smoke
        # Provenance is the requested channel and version and this commit,
        # clean; the run URL is this run's; the binary is static;
        # `ocx package create` takes it as release.yml's publish will. The caller's
        # inputs arrive through `env`, never spliced into the script.
        if: endsWith(matrix.target, '-linux-musl')
        env:
          TARGET: ${{ matrix.target }}
        run: >-
          task release:smoke
          BIN="target/bazel/release/ocx-mirror-$TARGET"
          TARGET="$TARGET"
          CHANNEL="$__OCX_BUILD_CHANNEL"
          VERSION="$__OCX_BUILD_VERSION"
          SHA="$(git rev-parse HEAD)"
      - name: Upload Binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ocx-mirror-${{ matrix.target }}
          path: target/bazel/release/ocx-mirror-${{ matrix.target }}${{ contains(matrix.target, 'windows') && '.exe' || '' }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      # A composite action has no `post:` hook (basic-repo.yml's reason): a failed
      # or cancelled job must not leave the credential on the runner.
      - name: Remove the Bazel cache credential
        if: always()
        uses: ./.github/actions/bazel-cache-rc
        with:
          cleanup: 'true'

  smoke-native:
    # The darwin and windows artifacts' smoke, each on a host that runs it: no
    # build here, only the `build` leg's binary. The x86_64 darwin one runs
    # under Rosetta on the arm64 runner. A red here fails the reusable
    # workflow, so the publish jobs that need `build` never see the artifact.
    name: Smoke (${{ matrix.target }})
    needs: build
    runs-on: ${{ matrix.os }}
    env:
      __OCX_BUILD_VERSION: ${{ inputs.version_semver }}
      __OCX_BUILD_CHANNEL: ${{ inputs.channel }}
      # Git Bash's `env` would rewrite arguments that look like POSIX paths.
      MSYS_NO_PATHCONV: "1"
      TARGET: ${{ matrix.target }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: x86_64-apple-darwin, ext: '' }
          - { os: macos-latest, target: aarch64-apple-darwin, ext: '' }
          - { os: windows-latest, target: x86_64-pc-windows-gnullvm, ext: .exe }
          - { os: windows-11-arm, target: aarch64-pc-windows-gnullvm, ext: .exe }
    steps:
      - name: Keep LF line ends
        run: git config --global core.autocrlf false
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Setup Task
        uses: go-task/setup-task@01a4adf9db2d14c1de7a560f09170b6e0df736aa # v2.1.0
      - name: Setup OCX
        # The ocx binary alone: ocx.toml's bazel has no windows/arm64 build,
        # so the project pull fails there (run 35980500812), and the smoke
        # runs no project tool.
        uses: ocx-sh/setup-ocx@25fa771f8572572dc64528db89560de68a163a0e # v1.4.0
        with:
          version: "0.6.6"
          project: ""
      - name: Install Rosetta
        # An arm64 runner image may ship without the translator. Idempotent
        # when it is there.
        if: matrix.target == 'x86_64-apple-darwin'
        run: /usr/sbin/softwareupdate --install-rosetta --agree-to-license
      - name: Download Binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ocx-mirror-${{ matrix.target }}
          path: target/bazel/release
      - name: Smoke
        env:
          EXT: ${{ matrix.ext }}
        run: |
          # An artifact download drops the execute bit.
          chmod +x "target/bazel/release/ocx-mirror-$TARGET$EXT"
          task release:smoke \
            BIN="target/bazel/release/ocx-mirror-$TARGET$EXT" \
            TARGET="$TARGET" \
            CHANNEL="$__OCX_BUILD_CHANNEL" \
            VERSION="$__OCX_BUILD_VERSION" \
            SHA="$(git rev-parse HEAD)"
