name: Build Targets

# Reusable 6-target build matrix shared by deploy-dev.yml (rolling dev
# publishes) and release.yml (tag-driven releases) — one build path, zero
# dev/release drift. Uploads one bare-binary artifact per target named
# `ocx-mirror-<target>`.

on:
  workflow_call:
    inputs:
      version_semver:
        description: SemVer build version, baked in as `__OCX_BUILD_VERSION`
          (what `ocx-mirror version` prints).
        required: true
        type: string
      channel:
        description: Build channel baked into the binary (`dev`, `release`, or
          `check` for build-check.yml's never-published builds).
        required: true
        type: string
    secrets:
      BAZEL_CACHE_READ_AUTH:
        description: The shared Bazel cache's read credential. Optional —
          without it every leg builds cold.
        required: false

permissions:
  contents: read

jobs:
  build-linux:
    # Bazel (`task bazel:build:release`): //:ocx-mirror for the target's
    # //platforms triple — rustc + zig's musl through hermetic_cc_toolchain,
    # static, with build.rs's real provenance read by
    # release/workspace_status.py from this job's environment (the two
    # `__OCX_BUILD_*` below, CI, GITHUB_*). Both triples cross-compile on the
    # x86_64 runner; the aarch64 smoke runs under qemu-aarch64.
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    env:
      __OCX_BUILD_VERSION: ${{ inputs.version_semver }}
      __OCX_BUILD_CHANNEL: ${{ inputs.channel }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          persist-credentials: false
      - name: Setup Task
        uses: go-task/setup-task@01a4adf9db2d14c1de7a560f09170b6e0df736aa # v2.1.0
      - name: Setup OCX
        # `ocx exec bazel` (ocx.toml's bazel row) runs Bazel; the smoke's
        # `ocx package create` is this binary too. The same pin as verify.yml
        # and oci-publish.yml.
        uses: ocx-sh/setup-ocx@de8e3366f812941423985eaccae28663ef192e8b # v1.3.0
        with:
          version: "0.6.2"
      # Read-only, on every caller: a build here never writes the shared
      # cache (the upload grant is verify.yml's `main` push alone, C3), and
      # the one action that reads the workspace status is `no-remote-cache`
      # besides. The read credential only hits third-party and exec-tool
      # compiles; a caller that maps no secret builds cold.
      - name: Bazel cache credential
        uses: ./.github/actions/bazel-cache-rc
        with:
          read-auth: ${{ secrets.BAZEL_CACHE_READ_AUTH }}
      # verify.yml's reason: the host C toolchain (build scripts, proc
      # macros) autoconfigures `-fuse-ld=` from what it finds, and the same
      # linker keeps those exec compiles on verify.yml's cache keys.
      - name: Install lld and qemu
        run: sudo apt-get update && sudo apt-get install -y lld qemu-user
      - name: Build
        env:
          TARGET: ${{ matrix.target }}
        run: task bazel:build:release TARGET="$TARGET" JOBS=auto
      - name: Smoke
        # Provenance is the requested channel and version and this commit,
        # clean; the run URL is this run's; the binary is static;
        # `ocx package create` takes it as oci-publish.yml will. The caller's
        # inputs arrive through `env`, never spliced into the script.
        env:
          TARGET: ${{ matrix.target }}
        run: >-
          task release:smoke
          BIN="target/bazel/release/ocx-mirror-$TARGET"
          TARGET="$TARGET"
          CHANNEL="$__OCX_BUILD_CHANNEL"
          VERSION="$__OCX_BUILD_VERSION"
          SHA="$GITHUB_SHA"
      - name: Upload Binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ocx-mirror-${{ matrix.target }}
          path: target/bazel/release/ocx-mirror-${{ matrix.target }}
          compression-level: 0
          retention-days: 1
      # A composite action has no `post:` hook (verify.yml's reason): a failed
      # or cancelled job must not leave the credential on the runner.
      - name: Remove the Bazel cache credential
        if: always()
        uses: ./.github/actions/bazel-cache-rc
        with:
          cleanup: 'true'

  build-darwin:
    # Bazel on one arm64 macOS runner for both triples, as the cargo leg ran
    # (`task bazel:build:release`): rustc for the triple and apple_support's
    # Apple clang toolchain (`-arch x86_64` for the cross triple), linked
    # against the runner's Xcode SDK — zig cannot link the Apple frameworks
    # the TLS stack needs. Not an Intel runner: the arm64 host cross-compiles
    # x86_64 with the same toolchain family, and runs it under Rosetta for
    # the smoke.
    name: Build (${{ matrix.target }})
    runs-on: macos-latest
    env:
      __OCX_BUILD_VERSION: ${{ inputs.version_semver }}
      __OCX_BUILD_CHANNEL: ${{ inputs.channel }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-apple-darwin
          - aarch64-apple-darwin
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          persist-credentials: false
      - name: Setup Task
        uses: go-task/setup-task@01a4adf9db2d14c1de7a560f09170b6e0df736aa # v2.1.0
      - name: Setup OCX
        uses: ocx-sh/setup-ocx@de8e3366f812941423985eaccae28663ef192e8b # v1.3.0
        with:
          version: "0.6.2"
      # Read-only, as on the Linux legs. No other lane writes darwin keys, so
      # it reads nothing today; it keeps the three legs one shape.
      - name: Bazel cache credential
        uses: ./.github/actions/bazel-cache-rc
        with:
          read-auth: ${{ secrets.BAZEL_CACHE_READ_AUTH }}
      - name: Install Rosetta
        # The x86_64 smoke runs the binary; an arm64 runner image may ship
        # without the translator. Idempotent when it is there.
        if: matrix.target == 'x86_64-apple-darwin'
        run: /usr/sbin/softwareupdate --install-rosetta --agree-to-license
      - name: Build
        env:
          TARGET: ${{ matrix.target }}
        run: task bazel:build:release TARGET="$TARGET" JOBS=auto
      - name: Smoke
        env:
          TARGET: ${{ matrix.target }}
        run: >-
          task release:smoke
          BIN="target/bazel/release/ocx-mirror-$TARGET"
          TARGET="$TARGET"
          CHANNEL="$__OCX_BUILD_CHANNEL"
          VERSION="$__OCX_BUILD_VERSION"
          SHA="$GITHUB_SHA"
      - name: Upload Binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ocx-mirror-${{ matrix.target }}
          path: target/bazel/release/ocx-mirror-${{ matrix.target }}
          compression-level: 0
          retention-days: 1
      - name: Remove the Bazel cache credential
        if: always()
        uses: ./.github/actions/bazel-cache-rc
        with:
          cleanup: 'true'

  build-windows:
    # Bazel on one x86_64 Windows runner for both triples: rustc for the
    # triple, linked by rules_cc's MSVC toolchain from the runner's Visual
    # Studio (`x64_arm64` for aarch64). MSVC, as cargo-xwin built them: the
    # same dynamic CRT (VCRUNTIME140 + the UCRT API sets) for every user.
    # The aarch64 binary cannot run here; smoke-windows-arm64 smokes it.
    name: Build (${{ matrix.target }})
    runs-on: windows-latest
    env:
      __OCX_BUILD_VERSION: ${{ inputs.version_semver }}
      __OCX_BUILD_CHANNEL: ${{ inputs.channel }}
      # Git Bash's `env` (the tasks' `{{.BAZEL}}` prefix) rewrites arguments
      # that look like POSIX paths for the native program it starts:
      # `--platforms=//platforms:…` reached Bazel as `/platforms:…` (run
      # 35947180548). Every path the tasks hand over is native already.
      MSYS_NO_PATHCONV: "1"
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-pc-windows-msvc
          - aarch64-pc-windows-msvc
    steps:
      # The runner's git converts to CRLF on checkout, and this repository has
      # no .gitattributes: the templates the binary `include_str!`s would ship
      # with CRLF, unlike every cargo-built and Linux-built artifact.
      - name: Keep LF line ends
        run: git config --global core.autocrlf false
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          persist-credentials: false
      # Bazel's default output root sits under the user profile; action
      # paths below it (external crate trees, bazel-out configs) outgrow
      # MAX_PATH for MSVC's tools. A home rc, outside the workspace — the
      # dev host's ~/.bazelrc carries its output root the same way.
      - name: Short Bazel output root
        run: echo 'startup --output_user_root=C:/b' >> "$HOME/.bazelrc"
      - name: Setup Task
        uses: go-task/setup-task@01a4adf9db2d14c1de7a560f09170b6e0df736aa # v2.1.0
      - name: Setup OCX
        uses: ocx-sh/setup-ocx@de8e3366f812941423985eaccae28663ef192e8b # v1.3.0
        with:
          version: "0.6.2"
      - name: Bazel cache credential
        uses: ./.github/actions/bazel-cache-rc
        with:
          read-auth: ${{ secrets.BAZEL_CACHE_READ_AUTH }}
      # rules_rust's local_crate_mirror (every path dependency: the ocx
      # crates, the forks) runs `find` and `cp` by name, and System32's
      # find.exe came first ("FIND: Parameter format not correct", run
      # 35949680898). Git's GNU tools go ahead of it for the later steps.
      - name: GNU tools ahead of System32
        run: cygpath -w /usr/bin >> "$GITHUB_PATH"
      - name: Build
        env:
          TARGET: ${{ matrix.target }}
        run: task bazel:build:release TARGET="$TARGET" JOBS=auto
      - name: Smoke
        if: matrix.target == 'x86_64-pc-windows-msvc'
        env:
          TARGET: ${{ matrix.target }}
        run: >-
          task release:smoke
          BIN="target/bazel/release/ocx-mirror-$TARGET.exe"
          TARGET="$TARGET"
          CHANNEL="$__OCX_BUILD_CHANNEL"
          VERSION="$__OCX_BUILD_VERSION"
          SHA="$GITHUB_SHA"
      - name: Upload Binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ocx-mirror-${{ matrix.target }}
          path: target/bazel/release/ocx-mirror-${{ matrix.target }}.exe
          compression-level: 0
          retention-days: 1
      - name: Remove the Bazel cache credential
        if: always()
        uses: ./.github/actions/bazel-cache-rc
        with:
          cleanup: 'true'

  smoke-windows-arm64:
    # The aarch64 windows artifact's smoke, on an arm64 Windows runner: the
    # only host that runs it. A red here fails the reusable workflow, so the
    # publish jobs that need `build` never see the artifact.
    name: Smoke (aarch64-pc-windows-msvc)
    needs: build-windows
    runs-on: windows-11-arm
    env:
      __OCX_BUILD_VERSION: ${{ inputs.version_semver }}
      __OCX_BUILD_CHANNEL: ${{ inputs.channel }}
      MSYS_NO_PATHCONV: "1"
      TARGET: aarch64-pc-windows-msvc
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep LF line ends
        run: git config --global core.autocrlf false
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Setup Task
        uses: go-task/setup-task@01a4adf9db2d14c1de7a560f09170b6e0df736aa # v2.1.0
      - name: Setup OCX
        uses: ocx-sh/setup-ocx@de8e3366f812941423985eaccae28663ef192e8b # v1.3.0
        with:
          version: "0.6.2"
      - name: Download Binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ocx-mirror-aarch64-pc-windows-msvc
          path: target/bazel/release
      - name: Smoke
        run: >-
          task release:smoke
          BIN="target/bazel/release/ocx-mirror-$TARGET.exe"
          TARGET="$TARGET"
          CHANNEL="$__OCX_BUILD_CHANNEL"
          VERSION="$__OCX_BUILD_VERSION"
          SHA="$GITHUB_SHA"
