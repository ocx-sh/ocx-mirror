name: Release

# Hand-written release pipeline, dispatched by hand. One workflow ships three kinds of build:
#
#   release    `X.Y.Z`, the Cargo.toml version, from refs/heads/main. Verify and readiness gates, six platforms
#              signed and attested, then tag `vX.Y.Z` and the GitHub release, the index announce and the
#              prune of old candidates.
#   candidate  `X.Y.Z-rcN` of the same Cargo.toml version, from refs/heads/main. As a release, but a
#              GitHub pre-release and an ephemeral index row.
#   dev        a build of the dispatched branch, versioned from Cargo.toml, with no git tag and no GitHub release.
#              The pre-release track follows the ref:
#              `X.Y.Z-canary` from main (canary.yml dispatches it after every green verify-basic): published to the
#              release package, announced as an ephemeral index row;
#              `X.Y.Z-pr<N>` from a branch with an open pull request: dev package, unannounced, with a sticky pull
#              request comment carrying its address;
#              `X.Y.Z-dev` from any other branch: dev package, unannounced.
#              None of the dev tracks is pruned here: `prune.yml` (daily, and by dispatch) prunes the dev, pull
#              request and canary builds, so cleanup never waits on a later build succeeding.
#
#   verify-version -> plan -> build -> publish -> github-release -> announce -> prune (release)
#                       |-> verify, readiness (release, candidate) -^    \-> comment (pr<N>)
#                       \-> sbom ------------------------------------^
#
# Signing identity. Every signature and attestation of the package is made by the `publish` job of this
# file (never by a called workflow, whose certificate would name the called file), so the certificate
# says `<repo>/.github/workflows/release.yml@<ref>`: `refs/heads/main` for a release, a candidate or a canary.
# `publish` verifies each platform against that identity before anything else runs. `backfill.yml` is the
# second identity, for versions published before this workflow signed.
#
# The tag `vX.Y.Z` is created by `github-release`, after `publish` has signed, never before. The floating
# tags move even later: `publish` pushes all six platforms to the one build tag without `--cascade`, signs and
# attests each, verifies every platform, and only then runs `ocx package cascade repair` (scoped to that build
# tag) to write `X.Y.Z`, `X.Y`, `X` and `latest`, or the candidate's and the dev build's rolling tags. No
# floating tag a user installs from therefore moves before every platform is pushed, signed, attested and verified.
#
# Repository values live in the one `env:` block below, so a copy of this file elsewhere differs only there.

run-name: "release ${{ inputs.mode }}${{ inputs.mode != 'dev' && format(' {0}', inputs.version) || '' }}"

on:
  workflow_dispatch:
    inputs:
      mode:
        description: What to ship.
        required: true
        type: choice
        options:
          - release
          - candidate
          - dev
      version:
        description: >-
          release: X.Y.Z (the Cargo.toml version). candidate: X.Y.Z-rcN, same X.Y.Z. dev: ignored.
        required: false
        type: string
        default: ''
      prune_after_days:
        description: >-
          Age in days before a candidate of a released version (release mode) is pruned.
        required: false
        type: number
        default: 30

permissions: {}

env:
  REPOSITORY_ID: "1266566464"
  PACKAGE_RELEASE: ghcr.io/ocx-sh/ocx/mirror
  PACKAGE_DEV: ghcr.io/ocx-sh/dev/mirror
  # The package as the index and its users name it; the physical home is `PACKAGE_RELEASE`.
  PACKAGE_LOGICAL: ocx.sh/ocx/mirror
  INDEX_REPO: ocx-sh/index
  INDEX_PACKAGE: ocx/mirror
  # Whitespace-separated rows of `<asset triple> <OCI platform>`.
  PLATFORMS: |
    x86_64-unknown-linux-musl linux/amd64
    aarch64-unknown-linux-musl linux/arm64
    x86_64-apple-darwin darwin/amd64
    aarch64-apple-darwin darwin/arm64
    x86_64-pc-windows-gnullvm windows/amd64
    aarch64-pc-windows-gnullvm windows/arm64
  OIDC_ISSUER: https://token.actions.githubusercontent.com
  # The identity a release, a candidate or a canary is verified against, pinned here rather than derived from the
  # run: a run from any other ref cannot pass its own self-verify. A build of the dev package runs from any branch
  # and verifies against its own workflow ref instead.
  RELEASE_IDENTITY: ${{ github.server_url }}/ocx-sh/ocx-mirror/.github/workflows/release.yml@refs/heads/main

concurrency:
  # A release and a candidate share a group (they write the same package's version tags). A dev run, canary
  # included, queues per ref: in the release group an automatic canary could evict a waiting release.
  group: release-${{ inputs.mode == 'dev' && format('dev-{0}', github.ref) || 'release' }}
  # Only one run waits per group: a newer dispatch replaces a run still waiting. A half-published release is worse
  # than a queued one.
  cancel-in-progress: false

jobs:
  verify-version:
    name: Verify the version
    permissions:
      contents: read
    uses: ./.github/workflows/verify-version.yml
    with:
      mode: ${{ inputs.mode }}
      version: ${{ inputs.version }}

  plan:
    name: Plan
    needs: verify-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      semver: ${{ steps.plan.outputs.semver }}
      tag: ${{ steps.plan.outputs.tag }}
      package: ${{ steps.plan.outputs.package }}
      git_tag: ${{ steps.plan.outputs.git_tag }}
      track: ${{ steps.plan.outputs.track }}
      pull_request: ${{ steps.plan.outputs.pull_request }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Plan the build
        id: plan
        env:
          MODE: ${{ inputs.mode }}
          VERSION: ${{ inputs.version }}
          REPOSITORY_ID_ACTUAL: ${{ github.repository_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$REPOSITORY_ID_ACTUAL" != "$REPOSITORY_ID" ]]; then
            echo "::error::this workflow publishes only from the repository it was written for (id $REPOSITORY_ID)"
            exit 1
          fi
          # Freeze the UTC build stamp once: every platform push below lands on one tag.
          ts="$(date -u +%Y%m%d%H%M%S)"
          track=""
          pull_request=""
          case "$MODE" in
            release | candidate)
              if [[ "$MODE" == candidate ]]; then
                shape='^[0-9]+\.[0-9]+\.[0-9]+-rc[1-9][0-9]*$'
              else
                shape='^[0-9]+\.[0-9]+\.[0-9]+$'
              fi
              if ! [[ "$VERSION" =~ $shape ]]; then
                echo "::error::version '$VERSION' does not fit a $MODE (expected $shape)"
                exit 1
              fi
              if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
                echo "::error::release and candidate run only from refs/heads/main (this run is $GITHUB_REF)"
                exit 1
              fi
              if git rev-parse --quiet --verify "refs/tags/v${VERSION}" >/dev/null; then
                echo "::error::tag v${VERSION} already exists"
                exit 1
              fi
              semver="$VERSION"
              tag="${VERSION}_${ts}"
              package="$PACKAGE_RELEASE"
              git_tag="v${VERSION}"
              ;;
            dev)
              core="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
              if ! [[ "$core" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                echo "::error::the Cargo.toml workspace version '$core' is not X.Y.Z"
                exit 1
              fi
              # The track follows the ref. A failed PR lookup fails the run: it never falls back to `dev`.
              pr=""
              if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
                track=canary
              else
                pr="$(gh api -X GET "repos/$GITHUB_REPOSITORY/pulls" -f state=open -f head="$GITHUB_REPOSITORY_OWNER:$GITHUB_REF_NAME" --jq '.[0].number // empty')"
                if [[ -z "$pr" ]]; then
                  track=dev
                elif [[ "$pr" =~ ^[1-9][0-9]*$ ]]; then
                  track="pr$pr"
                  pull_request="$pr"
                else
                  echo "::error::pull request number '$pr' is not a number"
                  exit 1
                fi
              fi
              # `+` is not an OCI reference character; the binary embeds the semver form, the package carries `_`.
              semver="${core}-${track}+${ts}"
              tag="${core}-${track}_${ts}"
              package="$PACKAGE_DEV"
              git_tag=""
              # Only a canary reaches the release package: it alone runs from main, the ref the release identity names.
              if [[ "$track" == canary ]]; then
                package="$PACKAGE_RELEASE"
              fi
              ;;
            *)
              echo "::error::mode '$MODE' is not release, candidate or dev"
              exit 1
              ;;
          esac
          {
            echo "semver=$semver"
            echo "tag=$tag"
            echo "package=$package"
            echo "git_tag=$git_tag"
            echo "track=$track"
            echo "pull_request=$pull_request"
          } >> "$GITHUB_OUTPUT"

  # The repo-owned half of the basic tier (Bazel acceptance, sharded acceptance) on the dispatched commit. It
  # holds no signing step and reads the shared cache with the read credential only.
  verify:
    name: Verify
    if: ${{ inputs.mode != 'dev' }}
    needs: plan
    uses: ./.github/workflows/basic-repo.yml
    permissions:
      contents: read
    secrets:
      BAZEL_CACHE_READ_AUTH: ${{ secrets.BAZEL_CACHE_READ_AUTH }}

  readiness:
    name: Readiness gate
    if: ${{ inputs.mode != 'dev' }}
    needs: plan
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/readiness-gate.yml
    with:
      sha: ${{ github.sha }}

  # No cache secret: the build that produces release bytes holds no credential (D-24).
  build:
    name: Build
    needs: plan
    permissions:
      contents: read
    uses: ./.github/workflows/build-matrix.yml
    with:
      version_semver: ${{ needs.plan.outputs.semver }}
      channel: ${{ inputs.mode }}

  # One CycloneDX document per triple, the predicate `publish` attests. Built from the source, not from the
  # binaries, so it runs beside `build`.
  sbom:
    name: SBOMs
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install the Rust toolchain
        run: rustup toolchain install --no-self-update
      - name: Install the release ocx
        uses: ./.github/actions/release-ocx
        with:
          mode: ${{ inputs.mode == 'dev' && needs.plan.outputs.track == 'canary' && 'canary' || inputs.mode }}
      - name: Generate the SBOMs
        run: |
          set -euo pipefail
          mkdir -p dist
          if [[ -z "$PLATFORMS" ]]; then
            echo "::error::no platforms to describe"
            exit 1
          fi
          while read -r triple _ <&3; do
            [[ -n "$triple" ]] || continue
            ocx exec -g release -- python3 scripts/release_sbom.py \
              --target "$triple" --output "dist/ocx-mirror-${triple}.cdx.json"
          done 3<<< "$PLATFORMS"
      - name: Upload the SBOMs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-sbom
          path: dist/*.cdx.json
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  # The only job that signs or attests the package. Never move a signing step into a called workflow: the
  # certificate would name that workflow, not this file.
  publish:
    name: Publish and sign
    needs: [plan, verify, readiness, build, sbom]
    # A skipped verify or readiness job passes only for a dev build; a release or a candidate needs both green.
    if: >-
      ${{ !cancelled()
      && needs.plan.result == 'success'
      && needs.build.result == 'success'
      && needs.sbom.result == 'success'
      && ((needs.verify.result == 'success' && needs.readiness.result == 'success')
      || (inputs.mode == 'dev' && needs.verify.result == 'skipped' && needs.readiness.result == 'skipped')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the release ocx
        uses: ./.github/actions/release-ocx
        with:
          mode: ${{ inputs.mode == 'dev' && needs.plan.outputs.track == 'canary' && 'canary' || inputs.mode }}
      - name: Download the binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ocx-mirror-*
          path: dist
          merge-multiple: true
      - name: Download the SBOMs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-sbom
          path: dist
      - name: Package, push and sign every platform
        env:
          MODE: ${{ inputs.mode }}
          PACKAGE: ${{ needs.plan.outputs.package }}
          TAG: ${{ needs.plan.outputs.tag }}
          OCX_AUTH_ghcr_io_USER: ${{ github.actor }}
          OCX_AUTH_ghcr_io_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tags_file="$GITHUB_WORKSPACE/published-tags.txt"
          : > "$tags_file"
          # No `--cascade`: the floating tags move in the last step of this job, after the verify.
          flags=(--sign --tags-file "$tags_file"
            --annotation "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}")
          # Only a release pins its manifests with a keep tag; a candidate or a dev build stays removable.
          [[ "$MODE" == release ]] || flags+=(--no-keep-tag)
          # Rows come in on fd 3 so no command in the body can consume them from stdin.
          if [[ -z "$PLATFORMS" ]]; then
            echo "::error::no platforms to publish"
            exit 1
          fi
          expected="$(grep -c . <<< "$PLATFORMS")"
          published=0
          while read -r asset platform <&3; do
            [[ -n "$asset" ]] || continue
            binary="dist/ocx-mirror-${asset}"
            [[ "$asset" == *windows* ]] && binary="${binary}.exe"
            scripts/publish_mirror_package.sh \
              --identifier "${PACKAGE}:${TAG}" \
              --platform "$platform" \
              --binary "$binary" \
              --sbom "dist/ocx-mirror-${asset}.cdx.json" \
              "${flags[@]}"
            published=$((published + 1))
          done 3<<< "$PLATFORMS"
          if ((published != expected)); then
            echo "::error::published $published of $expected platforms"
            exit 1
          fi
      - name: Verify every platform against this workflow's identity
        env:
          PACKAGE: ${{ needs.plan.outputs.package }}
          TAG: ${{ needs.plan.outputs.tag }}
          OCX_AUTH_ghcr_io_USER: ${{ github.actor }}
          OCX_AUTH_ghcr_io_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Whatever lands in the release package is verified against the pinned identity, a canary included.
          if [[ "$PACKAGE" == "$PACKAGE_DEV" ]]; then
            identity="${GITHUB_SERVER_URL}/${GITHUB_WORKFLOW_REF}"
          else
            identity="$RELEASE_IDENTITY"
          fi
          if [[ -z "$PLATFORMS" ]]; then
            echo "::error::no platforms to verify"
            exit 1
          fi
          expected="$(grep -c . <<< "$PLATFORMS")"
          verified=0
          while read -r asset platform <&3; do
            [[ -n "$asset" ]] || continue
            ocx package verify -p "$platform" \
              --certificate-identity "$identity" --certificate-oidc-issuer "$OIDC_ISSUER" \
              "${PACKAGE}:${TAG}"
            ocx package verify -p "$platform" --attestation --type cyclonedx \
              --certificate-identity "$identity" --certificate-oidc-issuer "$OIDC_ISSUER" \
              "${PACKAGE}:${TAG}"
            verified=$((verified + 1))
          done 3<<< "$PLATFORMS"
          if ((verified != expected)); then
            echo "::error::verified $verified of $expected platforms"
            exit 1
          fi
      # Repository-level catalog description (the `__ocx.desc` tag), refreshed on every publish. CATALOG.md, not
      # README.md: the README carries CI badges and repo-relative links that resolve nowhere in a catalog
      # renderer, and CATALOG.md's frontmatter supplies the title, description and keywords. It runs before the floating
      # tags move so that a failure here strands nothing: no floating tag, tag or release exists yet, and a rerun is clean.
      - name: Push the catalog description
        env:
          PACKAGE: ${{ needs.plan.outputs.package }}
          OCX_AUTH_ghcr_io_USER: ${{ github.actor }}
          OCX_AUTH_ghcr_io_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ocx package description push "$PACKAGE" --readme CATALOG.md --logo assets/logo.svg
      # The one place a floating tag is written. Every platform above is pushed under the build tag, signed,
      # attested and verified before this step runs, so no floating tag moves before then; `cascade repair` only
      # re-points tags at content the registry already serves (it uploads nothing) and is scoped to this build tag.
      # It also appends the tags it moved, or found already current, to the file `announce` reads.
      - name: Move the floating tags
        env:
          PACKAGE: ${{ needs.plan.outputs.package }}
          TAG: ${{ needs.plan.outputs.tag }}
          OCX_AUTH_ghcr_io_USER: ${{ github.actor }}
          OCX_AUTH_ghcr_io_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tags_file="$GITHUB_WORKSPACE/published-tags.txt"
          ocx package cascade repair --tags-file "$tags_file" "${PACKAGE}:${TAG}"
      # 7 days, not 1: `announce` waits behind the ocx.sh environment, and a late approval or rerun must still find this file.
      - name: Upload the published tags
        if: ${{ inputs.mode != 'dev' || needs.plan.outputs.track == 'canary' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: published-tags
          path: published-tags.txt
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  github-release:
    name: GitHub release
    if: ${{ inputs.mode != 'dev' }}
    needs: [plan, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup OCX (runs the locked git-cliff)
        uses: ocx-sh/setup-ocx@eaeb6788da6191868a1310cc2bba93233b586369 # v1.4.1
        with:
          version: '0.6.8'
          project: ''
          cache: false
      - name: Download the binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ocx-mirror-*
          path: dist
          merge-multiple: true
      - name: Package the archives
        run: |
          set -euo pipefail
          mkdir -p out
          for t in x86_64-unknown-linux-musl aarch64-unknown-linux-musl x86_64-apple-darwin aarch64-apple-darwin; do
            d="ocx-mirror-${t}"
            mkdir -p "$d/bin"
            install -m 0755 "dist/ocx-mirror-${t}" "$d/bin/ocx-mirror"
            tar -cJf "out/${d}.tar.xz" "$d"
          done
          for t in x86_64-pc-windows-gnullvm aarch64-pc-windows-gnullvm; do
            d="ocx-mirror-${t}"
            mkdir -p "$d/bin"
            cp "dist/ocx-mirror-${t}.exe" "$d/bin/ocx-mirror.exe"
            zip -qr "out/${d}.zip" "$d"
          done
          (cd out && sha256sum -- * > sha256.sum)
      # `--target` makes GitHub create the tag at the dispatched commit together with the release, so the tag
      # exists only once `publish` has signed.
      - name: Create the tag and the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MODE: ${{ inputs.mode }}
          GIT_TAG: ${{ needs.plan.outputs.git_tag }}
        run: |
          set -euo pipefail
          ocx exec -g release -- git-cliff --unreleased --tag "$GIT_TAG" --strip header --output "$RUNNER_TEMP/notes.md"
          args=(--target "$GITHUB_SHA" --title "$GIT_TAG" --notes-file "$RUNNER_TEMP/notes.md")
          if [[ "$MODE" == candidate ]]; then
            args+=(--prerelease)
          else
            args+=(--latest)
          fi
          gh release create "$GIT_TAG" "${args[@]}" out/*

  # A skipped `github-release` passes only for the canary track; a release or a candidate needs it green.
  announce:
    name: Announce
    if: >-
      ${{ !cancelled()
      && needs.publish.result == 'success'
      && (needs.github-release.result == 'success'
      || (needs.plan.outputs.track == 'canary' && needs.github-release.result == 'skipped')) }}
    needs: [plan, publish, github-release]
    runs-on: ubuntu-latest
    environment: ocx.sh
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the release ocx
        uses: ./.github/actions/release-ocx
        with:
          mode: ${{ inputs.mode == 'dev' && needs.plan.outputs.track == 'canary' && 'canary' || inputs.mode }}
      - name: Download the published tags
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: published-tags
          path: ${{ runner.temp }}/tags
      - name: Announce into the index
        env:
          MODE: ${{ inputs.mode }}
          TAGS_FILE: ${{ runner.temp }}/tags/published-tags.txt
          OCX_ANNOUNCE_TOKEN: ${{ secrets.OCX_ANNOUNCE_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$OCX_ANNOUNCE_TOKEN" ]]; then
            echo "::error::OCX_ANNOUNCE_TOKEN is not available to the ocx.sh environment"
            exit 1
          fi
          if [[ ! -s "$TAGS_FILE" ]]; then
            echo "::error::publish recorded no tags; refusing to announce nothing"
            exit 1
          fi
          flags=(--tags-file "$TAGS_FILE" --index-repo "$INDEX_REPO")
          # Every row but a release's is removable without review; prune frees it later.
          [[ "$MODE" == release ]] || flags+=(--ephemeral)
          ocx package announce "${flags[@]}" "$INDEX_PACKAGE"

  # Release mode only: the candidates of a version that has shipped, once it is old enough. Their index rows
  # are ephemeral, so prune needs no `--force`; the announce then drops the rows of the tags that are gone.
  prune:
    name: Prune old candidates
    if: ${{ inputs.mode == 'release' }}
    needs: [plan, announce]
    runs-on: ubuntu-latest
    environment: ocx.sh
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the release ocx
        uses: ./.github/actions/release-ocx
        with:
          mode: ${{ inputs.mode == 'dev' && needs.plan.outputs.track == 'canary' && 'canary' || inputs.mode }}
      - name: Prune candidates of old releases
        id: prune
        env:
          DAYS: ${{ inputs.prune_after_days }}
          OCX_AUTH_ghcr_io_USER: ${{ github.actor }}
          OCX_AUTH_ghcr_io_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ocx --remote --format json index list "$PACKAGE_RELEASE" | jq -r '.items[].tags[]?' > "$RUNNER_TEMP/tags.txt"
          python3 scripts/release_prune_select.py candidates --days "$DAYS" < "$RUNNER_TEMP/tags.txt" > "$RUNNER_TEMP/selected.txt"
          mapfile -t selected < <(grep . "$RUNNER_TEMP/selected.txt" || true)
          if ((${#selected[@]} == 0)); then
            echo "No candidate of a release older than $DAYS days."
            exit 0
          fi
          ocx package prune --forge github --tags-file "$RUNNER_TEMP/pruned.txt" "$PACKAGE_LOGICAL" "${selected[@]}"
      # Only the announce carries the index token; prune does not need it. It runs after a failed prune too: roots
      # deleted before the failure must lose their rows. The failed prune step still fails the job.
      - name: Announce the pruned candidates
        if: ${{ !cancelled() && steps.prune.conclusion != 'skipped' }}
        env:
          OCX_ANNOUNCE_TOKEN: ${{ secrets.OCX_ANNOUNCE_TOKEN }}
        run: ocx package announce --refresh --index-repo "$INDEX_REPO" "$INDEX_PACKAGE"

  # The one comment of a pull request build, edited in place: its address is what another repository or an e2e run
  # copies. The marker plus the bot author find it; a marker comment by anyone else is never edited, and a failed
  # listing fails the job rather than posting a second comment.
  comment:
    name: Comment the pull request build
    if: ${{ !cancelled() && needs.publish.result == 'success' && needs.plan.outputs.pull_request != '' }}
    needs: [plan, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Post or update the build address
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE: ${{ needs.plan.outputs.package }}
          TAG: ${{ needs.plan.outputs.tag }}
          PULL_REQUEST: ${{ needs.plan.outputs.pull_request }}
        run: |
          set -euo pipefail
          marker='<!-- ocx-pr-build -->'
          rolling="${PACKAGE}:${TAG%%_*}"
          body="$RUNNER_TEMP/comment.md"
          # shellcheck disable=SC2016 # the backticks are Markdown code spans, not command substitutions
          {
            printf '%s\n## Pull request build\n\n' "$marker"
            printf 'Rolling: `%s`\nExact: `%s`\nCommit: `%s`\n\n' "$rolling" "${PACKAGE}:${TAG}" "$GITHUB_SHA"
            printf '```sh\nocx --remote package exec %s -- ocx-mirror version\n```\n\n' "$rolling"
            printf 'The rolling tag follows the newest build of this pull request; both are removed once the pull request is closed.\n'
          } > "$body"
          # A listing that fails aborts here: it never falls through to a second comment.
          found="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PULL_REQUEST/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and ((.body // "") | startswith("<!-- ocx-pr-build -->"))) | .id')"
          id="$(sed -n 1p <<< "$found")"
          if [[ -n "$id" ]]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@"$body"
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PULL_REQUEST/comments" -F body=@"$body"
          fi
