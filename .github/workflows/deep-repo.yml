# Seeded once by ocx-sh/conventions; this file belongs to the repo from here on.
# verify-deep calls it as its `repo` job: the repo-owned jobs of the nightly and labelled deep tier.
# A called workflow sees only the secrets it declares, so keep every secret the `repo_workflows` answer
# lists declared under `on.workflow_call.secrets`.
name: deep-repo

on:
  workflow_call:
    secrets:
      BAZEL_CACHE_WRITE_AUTH:
        required: false
      BAZEL_CACHE_READ_AUTH:
        required: false
      OTEL_OTLP_AUTH:
        required: false

permissions: {}

jobs:
  # The release build matrix with nothing published (the former build-check.yml): every leg release.yml runs, with the `check` channel baked in so a stray artifact can never pass for a dev or
  # release binary. Artifacts expire after a day (build-matrix.yml) and no publish job follows. Read-only
  # cache: build-matrix.yml takes the read credential alone.
  build-matrix:
    name: Release build matrix
    permissions:
      contents: read
    uses: ./.github/workflows/build-matrix.yml
    with:
      # A SemVer the smoke can assert on, visibly not a publishable version.
      version_semver: 0.0.0-check+${{ github.run_id }}
      channel: check
    secrets:
      BAZEL_CACHE_READ_AUTH: ${{ secrets.BAZEL_CACHE_READ_AUTH }}

  # The full acceptance suite on native macOS and Windows against the release binaries `build-matrix`
  # built (`ocx-mirror-<triple>[.exe]`). Neither runner has Docker, so `no-docker` declares it and the
  # registry:2 and Sigstore fixtures skip with a `no docker:` reason; the Linux basic tier runs them.
  acceptance-native:
    name: Acceptance (${{ matrix.job.os }})
    needs: build-matrix
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        job:
          - { os: macos-latest, triple: aarch64-apple-darwin, limits: test/limits/macos-release }
          - { os: windows-latest, triple: x86_64-pc-windows-gnullvm, limits: test/limits/windows-release }
    uses: ./.github/workflows/acceptance.yml
    with:
      os: ${{ matrix.job.os }}
      binary: artifact:ocx-mirror-${{ matrix.job.triple }}
      release-binary: true
      no-docker: true
      limits-dir: ${{ matrix.job.limits }}
      shard-count: 1
