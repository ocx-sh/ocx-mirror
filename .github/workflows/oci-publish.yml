name: OCI Publish

# Reusable workflow that publishes the bare-binary build artifacts from
# build-matrix.yml to an OCI registry as the `<repo>/mirror` OCX package.
# Called by `deploy-dev.yml` (rolling dev publishes to dev.ocx.sh) and
# `release.yml` (tag-driven releases to ocx.sh).
#
# Simplified copy of ocx's oci-publish.yml: single variant (ocx-mirror), the
# pushing `ocx` CLI comes from setup-ocx instead of same-run build artifacts
# (this repo never builds ocx).

on:
  workflow_call:
    inputs:
      registry:
        description: Registry hostname (e.g. `dev.ocx.sh`, `ghcr.io`).
        required: true
        type: string
      physical_namespace:
        description: Path segment prepended to `ocx/mirror` for the push target only,
          for a registry that namespaces by owner (`ghcr.io` → `ocx-sh`, giving
          `ghcr.io/ocx-sh/ocx/mirror`). The logical name the index is keyed by, and
          that `package announce` names, stays `ocx/mirror`.
        required: false
        type: string
        default: ""
      announce:
        description: Publish the pushed tags into the index. Only the release publish
          sets this — a dev tag does not exist on the repository the index root points
          at, so announcing one would observe nothing.
        required: false
        type: boolean
        default: false
      version_tag:
        description: Fully formed publish tag, including any pre-release and UTC
          build-metadata segments (e.g. `0.4.0-dev_20260612120000`). Callers
          freeze the build-metadata segment once per workflow run so every
          target leg of the publish loop shares the same tag.
        required: true
        type: string
      environment:
        description: GitHub Environment whose secrets gate the publish.
        required: true
        type: string
    secrets:
      REGISTRY_USER:
        required: true
      REGISTRY_TOKEN:
        required: true
      OCX_ANNOUNCE_TOKEN:
        description: GitHub credential the index announce pull request is opened
          with. Absent (fork build, dev publish) means publish without announcing.
        required: false

# No `permissions:` block on purpose. This workflow has two callers wanting
# different scopes — the release path needs `packages: write` for the GHCR push,
# the dev path pushes to dev.ocx.sh with its own registry credential and needs
# nothing. A declaration here caps BOTH (a called workflow can only narrow its
# caller's grant, never widen it), so each caller declares what it needs.

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Download binary artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ocx-mirror-*
          path: dist/
          merge-multiple: true

      - name: Setup OCX
        uses: ocx-sh/setup-ocx@de8e3366f812941423985eaccae28663ef192e8b # v1.3.0
        with:
          # Floor is 0.6.0, and it is a hard floor, not a preference: this
          # workflow spells `package description push` and `--tags-file`, which
          # 0.5.x rejects with exit 64. Kept level with the `external/ocx`
          # submodule pin so the CLI that publishes a release is the one the
          # release was built against.
          version: "0.6.0"

      - name: Publish to registry
        env:
          REGISTRY: ${{ inputs.registry }}
          PHYSICAL_NAMESPACE: ${{ inputs.physical_namespace }}
          ANNOUNCE: ${{ inputs.announce }}
          VERSION_TAG: ${{ inputs.version_tag }}
          OCX_AUTH_REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          OCX_AUTH_REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          OCX_ANNOUNCE_TOKEN: ${{ secrets.OCX_ANNOUNCE_TOKEN }}
        run: |
          set -euo pipefail

          # Validate registry before using it in dynamic export — prevents
          # command substitution injection via shell metacharacters.
          if ! [[ "${REGISTRY}" =~ ^[a-zA-Z0-9._-]+$ ]]; then
            echo "::error::registry '${REGISTRY}' contains invalid characters"
            exit 1
          fi
          case "$REGISTRY" in
            dev.ocx.sh|ghcr.io) ;;
            *) echo "::error::registry '$REGISTRY' not in allowlist"; exit 1 ;;
          esac

          # Same validation for the physical namespace: it lands in the push
          # identifier, so it must not carry shell metacharacters either.
          if [[ -n "${PHYSICAL_NAMESPACE}" ]] && ! [[ "${PHYSICAL_NAMESPACE}" =~ ^[a-zA-Z0-9._/-]+$ ]]; then
            echo "::error::physical_namespace '${PHYSICAL_NAMESPACE}' contains invalid characters"
            exit 1
          fi
          physical_prefix="${PHYSICAL_NAMESPACE:+${PHYSICAL_NAMESPACE}/}"

          # Map secrets to the registry-specific env names ocx reads.
          # Hostname dots become underscores in OCX_AUTH_<host>_USER/TOKEN.
          auth_key="$(echo "${REGISTRY}" | tr '.' '_')"
          export "OCX_AUTH_${auth_key}_USER=${OCX_AUTH_REGISTRY_USER}"
          export "OCX_AUTH_${auth_key}_TOKEN=${OCX_AUTH_REGISTRY_TOKEN}"

          declare -A PLATFORM_MAP=(
            ["x86_64-unknown-linux-musl"]="linux/amd64"
            ["aarch64-unknown-linux-musl"]="linux/arm64"
            ["x86_64-apple-darwin"]="darwin/amd64"
            ["aarch64-apple-darwin"]="darwin/arm64"
            ["x86_64-pc-windows-msvc"]="windows/amd64"
            ["aarch64-pc-windows-msvc"]="windows/arm64"
          )

          METADATA="packaging/metadata.json"

          # Every target leg appends the tags it published (plus the cascade
          # tags it moved) here; the announce at the end curates them in one call.
          announce_tags="$(mktemp)"
          for target in "${!PLATFORM_MAP[@]}"; do
            platform="${PLATFORM_MAP[$target]}"
            ext=""
            [[ "$target" == *windows* ]] && ext=".exe"
            SRC="dist/ocx-mirror-${target}${ext}"
            if [[ ! -f "$SRC" ]]; then
              echo "::error::missing artifact $SRC"
              exit 1
            fi

            WORK="$(mktemp -d)"
            mkdir -p "$WORK/repackage/bin"
            install -m 0755 "$SRC" "$WORK/repackage/bin/ocx-mirror${ext}"

            ARCHIVE="$WORK/ocx-mirror-${target}.tar.xz"
            ocx package create "$WORK/repackage" \
              -m "$METADATA" \
              -o "$ARCHIVE" \
              -p "$platform"

            identifier="${REGISTRY}/${physical_prefix}ocx/mirror:${VERSION_TAG}"
            echo "==> Publishing ${identifier} (${platform})"
            # No --metadata: `push` derives the sidecar path from its layer via
            # the same conventions::infer_metadata_file that `create` used to
            # write it. Handing it the SOURCE "${METADATA}" instead fails with
            # "metadata sidecar has no recorded platform" (exit 65) — only the
            # generated sidecar carries the recorded platform.
            # `image.source` is what links the GHCR package to this repository
            # and lets it inherit the repository's permissions; a registry derives
            # nothing from the path.
            ocx package push \
              --identifier "${identifier}" \
              --platform "${platform}" \
              --cascade \
              --annotation "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
              --tags-file "$announce_tags" \
              "$ARCHIVE"

            rm -rf "$WORK"
          done

          # Repository-level catalog description (__ocx.desc tag) — README from
          # CATALOG.md (frontmatter supplies title/description/keywords) plus
          # the project logo. Version-independent; refreshed on every publish.
          echo "==> Pushing catalog description for ${REGISTRY}/${physical_prefix}ocx/mirror"
          ocx package description push \
            --readme CATALOG.md \
            --logo assets/logo.svg \
            "${REGISTRY}/${physical_prefix}ocx/mirror"

          # Publish the just-pushed tags into the ocx-sh/index entry for
          # ocx/mirror. Runs AFTER `description push` so the announce observes the
          # fresh `__ocx.desc` tag and carries the catalog readme/logo into the index.
          #
          # No `--fork`: this repository lives in the organization that owns the
          # index, and GitHub refuses to fork a repository into its own owning
          # organization, so the announce branch is pushed to the index directly.
          # It still lands as a pull request, which is what the index's
          # governance gate and its refresh/new-package labelling run on.
          announce_skip=""
          # The announce re-observes each curated tag on the physical repository
          # the index root points at, which is the PROD registry — a dev tag
          # simply does not exist there. The caller declares which publish that
          # is; deriving it from the registry hostname went stale the moment the
          # prod registry moved to GHCR.
          if [[ "$ANNOUNCE" != "true" ]]; then
            announce_skip="this publish does not announce"
          elif [[ -z "${OCX_ANNOUNCE_TOKEN:-}" ]]; then
            announce_skip="OCX_ANNOUNCE_TOKEN is unavailable"
          fi
          if [[ -n "$announce_skip" ]]; then
            echo "::notice::skipping index announce for ocx/mirror: ${announce_skip}"
          elif [[ ! -s "$announce_tags" ]]; then
            echo "::error::no published tags recorded for ocx/mirror; refusing to announce nothing"
            exit 1
          else
            echo "==> Announcing ocx/mirror into ocx-sh/index"
            ocx package announce \
              --package ocx/mirror \
              --tags-file "$announce_tags" \
              --index-repo ocx-sh/index
          fi
          rm -f "$announce_tags"
