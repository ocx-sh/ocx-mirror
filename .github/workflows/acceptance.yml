name: Acceptance

# The native acceptance suite, sharded, with one merge job that judges the suite floor and the skip and
# xfail ceilings over every shard's report together (a floor is a property of the whole suite, never of
# one shard). Reusable: basic-repo.yml calls it on every pull request. Shape ported from ocx's
# acceptance.yml, cut to what the mirror needs: one binary source per call (a Bazel build or a prebuilt
# artifact), on any runner OS (`os`).
#
# Jobs: `plan` (shard list) -> `binary` (Bazel build of //:ocx-mirror) -> `shard` (pytest against that
# binary, no Bazel and no cache credential) -> `merge` (floor and ceilings). The cache credential lives
# in `binary` alone, so it never shares a runner with the tests.
#
# `shard-count` is the knob: raise it and each module lands in exactly one shard (scripts/accept_shard.py,
# `modules[I::N]`); the merge job requires one report per shard. The Bazel `//test:acceptance` suite
# (`task bazel:test:accept`, one cached sh_test) is a separate, repo-owned job in basic-repo.yml.

on:
  workflow_call:
    inputs:
      shard-count:
        description: Number of shards the suite is split into.
        type: number
        default: 1
      os:
        description: Runner label of the shard jobs (plan, binary and merge stay on ubuntu-latest).
        type: string
        default: ubuntu-latest
      binary:
        description: "`build` (Bazel-build the test binary here) or `artifact:<name>` (download that artifact of the calling run: one file, `ocx-mirror-<triple>[.exe]`, as build-matrix.yml uploads it)."
        type: string
        default: build
      limits-dir:
        description: Directory holding SUITE_FLOOR, SKIP_CEILING and XFAIL_CEILING the merge job judges against.
        type: string
        default: test
      release-binary:
        description: The binary under test is a release-provenance build (exports OCX_TEST_RELEASE_BINARY=1).
        type: boolean
        default: false
      no-docker:
        description: The runner has no Docker (exports OCX_TEST_NO_DOCKER=1; skips every compose, registry:2 and Sigstore step).
        type: boolean
        default: false
    secrets:
      BAZEL_CACHE_WRITE_AUTH:
        required: false
      BAZEL_CACHE_READ_AUTH:
        required: false

permissions: {}

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      build: ${{ steps.plan.outputs.build }}
      artifact: ${{ steps.plan.outputs.artifact }}
    steps:
      - name: Plan the shards
        id: plan
        env:
          SHARD_COUNT: ${{ inputs.shard-count }}
          BINARY: ${{ inputs.binary }}
        run: |
          set -euo pipefail
          case "$SHARD_COUNT" in
            ''|0|*[!0-9]*) echo "::error::shard-count must be a positive integer, got '$SHARD_COUNT'"; exit 1 ;;
          esac
          case "$BINARY" in
            build) build=true; artifact=acceptance-binary ;;
            artifact:?*) build=false; artifact="${BINARY#artifact:}" ;;
            *) echo "::error::binary must be 'build' or 'artifact:<name>', got '$BINARY'"; exit 1 ;;
          esac
          {
            echo "shards=[$(seq -s, 0 "$((SHARD_COUNT - 1))")]"
            echo "build=$build"
            echo "artifact=$artifact"
          } >> "$GITHUB_OUTPUT"

  # Builds the binary once for every shard. The only job here that holds the cache credential.
  binary:
    name: Build binary
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Setup
        uses: ocx-sh/conventions/.github/actions/setup@3d0df49d6d5771c52321d886e33a20ee36cfe76d # v0.3.4
        with:
          groups: default,build
          bazel-cache: ${{ secrets.BAZEL_CACHE_WRITE_AUTH != '' && 'trusted' || 'read' }}
          cache-read-auth: ${{ secrets.BAZEL_CACHE_READ_AUTH }}
          cache-write-auth: ${{ secrets.BAZEL_CACHE_WRITE_AUTH }}
      - name: Install lld
        # The linker the host C++ toolchain autoconfigures to is part of every link's action key; the
        # shared cache is only hit when every lane picks the same one (see .bazelrc).
        run: sudo apt-get update && sudo apt-get install -y lld
      - name: Build
        run: task bazel:build:test-binary JOBS=auto -- --config=ci
      - name: Remove the Bazel cache credential
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/bazel-cache-helper" "$RUNNER_TEMP/bazel-cache.rc"
      - name: Upload binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: acceptance-binary
          path: test/bin/ocx-mirror
          overwrite: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  shard:
    name: Acceptance (shard-${{ matrix.shard }}-of-${{ inputs.shard-count }})
    needs: [plan, binary]
    # `binary` is skipped under `artifact:<name>`; anything but success or skipped stops the shards.
    if: ${{ !cancelled() && !failure() }}
    runs-on: ${{ inputs.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # One level is enough: the Sigstore compose file lives in external/ocx/test, and the shard
          # builds nothing (the nested forks are for the Bazel build).
          submodules: true
      # `test/taskfile.yml` shells out to `python3` and the coreutils; a Windows runner has neither on the
      # PATH task's shell sees. Git's `usr\bin` carries the coreutils, and setup-python provides only
      # `python`, so `python3.exe` is a copy of it in the same directory. Linux images ship `python3`.
      - name: Setup Python
        if: runner.os != 'Linux'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Provide POSIX tools and python3 (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          printf '%s\n' 'C:\Program Files\Git\usr\bin' >> "$GITHUB_PATH"
          py_dir="$(dirname "$(command -v python)")"
          [ -e "$py_dir/python3.exe" ] || cp "$py_dir/python.exe" "$py_dir/python3.exe"
      # Puts `ocx` and `uv` (the project toolchain) on PATH; zot comes from `ocx exec zot --` (test/taskfile.yml).
      # No cache credential reaches this job.
      - name: Setup
        uses: ocx-sh/conventions/.github/actions/setup@3d0df49d6d5771c52321d886e33a20ee36cfe76d # v0.3.4
        with:
          groups: default,test
      - name: Download binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.plan.outputs.artifact }}
          path: test/bin
      # A prebuilt artifact is one `ocx-mirror-<triple>[.exe]` file; the harness reads test/bin/ocx-mirror[.exe].
      - name: Prepare binary
        shell: bash
        env:
          BUILD: ${{ needs.plan.outputs.build }}
        run: |
          set -euo pipefail
          if [ "$BUILD" != true ]; then
            src=$(find test/bin -maxdepth 1 -type f -name 'ocx-mirror-*' | head -n 1)
            [ -n "$src" ] || { echo "::error::no ocx-mirror-* file in the downloaded artifact"; exit 1; }
            case "$src" in *.exe) mv "$src" test/bin/ocx-mirror.exe ;; *) mv "$src" test/bin/ocx-mirror ;; esac
          fi
          [ "$RUNNER_OS" = Windows ] || chmod +x test/bin/ocx-mirror
      - name: Run Acceptance Tests
        # "$SHARD_COUNT" is bash syntax; the Windows default shell (PowerShell) would pass empty values.
        shell: bash
        env:
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_COUNT: ${{ inputs.shard-count }}
          # The harness brings the Sigstore stack up from ocx's compose file; the sibling ../ocx
          # checkout it defaults to does not exist here.
          OCX_SIGSTORE_COMPOSE: ${{ github.workspace }}/external/ocx/test/docker-compose.yml
          OCX_TEST_RELEASE_BINARY: ${{ inputs.release-binary && '1' || '' }}
          OCX_TEST_NO_DOCKER: ${{ inputs.no-docker && '1' || '' }}
          # Short pytest scratch, as `scripts/windows_local.sh` sets it: under the default
          # %TEMP%\pytest-of-runneradmin the mirror's index paths pass MAX_PATH (os error 3).
          TEST_BASETEMP: ${{ runner.temp }}/p
        run: task test:accept:native SHARD_COUNT="$SHARD_COUNT" SHARD_INDEX="$SHARD_INDEX"
      - name: Stop Docker services
        if: ${{ always() && !inputs.no-docker }}
        run: |
          docker compose -f external/ocx/test/docker-compose.yml --profile sigstore down 2>/dev/null || true
          docker compose -f test/docker-compose.yml down 2>/dev/null || true
      - name: Upload shard JUnit
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # One name per caller leg (runner OS and binary kind): callers in one run must not overwrite each other.
          name: accept-junit-${{ inputs.os }}-${{ inputs.release-binary && 'release' || 'build' }}-shard-${{ matrix.shard }}
          path: target/accept/junit/*.xml
          # A rerun of the shard uploads this name again, and the action refuses a name the run holds.
          overwrite: true
          retention-days: 1

  # The floor and the skip/xfail ceilings are properties of the whole suite, so they are judged over
  # every shard's report together, never per shard.
  merge:
    name: Acceptance (merged)
    needs: shard
    if: ${{ !cancelled() && needs.shard.result != 'skipped' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download shard reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: accept-junit-${{ inputs.os }}-${{ inputs.release-binary && 'release' || 'build' }}-shard-*
          path: accept-junit
          merge-multiple: true
      - name: Suite floor and ceilings
        env:
          SHARD_COUNT: ${{ inputs.shard-count }}
          LIMITS_DIR: ${{ inputs.limits-dir }}
        run: python3 scripts/accept_floor.py --junit "$GITHUB_WORKSPACE/accept-junit" --limits-dir "$GITHUB_WORKSPACE/$LIMITS_DIR" --expect-shards "$SHARD_COUNT"
      # Annotations and the job summary only: the caller grants `contents: read`, so no check run.
      - name: Publish acceptance results
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@6ef3fdcfcd5f0b5d14df3e659ef19b8c6820f93d # v6.6.1
        with:
          report_paths: accept-junit/*.xml
          require_tests: false
          annotate_only: true
