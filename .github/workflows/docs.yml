name: Docs

# Build the mkdocs-material site and deploy to GitHub Pages via the
# artifact-based deploy-pages flow (no gh-pages branch, OIDC, Pages
# environment protection applies). Repo setting: Pages → Source = "GitHub Actions".
#
# The site is the Bazel target `//docs:site` (docs/BUILD.bazel): hermetic and
# remote-cacheable, so a tree `verify.yml`'s main-push lane already built is a
# cache hit here. This workflow only READS the shared cache — the one write
# lane is verify.yml's.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "CHANGELOG.md"
      - ".github/workflows/docs.yml"
      # The site is `//docs:site` (docs/BUILD.bazel): the pins that decide its
      # interpreter and wheels, and the task that builds it.
      - "MODULE.bazel"
      - "MODULE.bazel.lock"
      - "taskfiles/docs.taskfile.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          # Naming mkdocs.yml/CHANGELOG.md loads the root package, which loads
          # @crates; `bazel:bootstrap` splices it from the path deps in
          # external/ocx and the [patch.crates-io] forks in its submodules.
          submodules: recursive
      - name: Setup OCX
        # `ocx exec bazel` (ocx.toml's bazel row) runs every Bazel command.
        uses: ocx-sh/setup-ocx@de8e3366f812941423985eaccae28663ef192e8b # v1.3.0
        with:
          version: "0.6.2"
      - name: Setup Task
        uses: go-task/setup-task@01a4adf9db2d14c1de7a560f09170b6e0df736aa # v2.1.0
      - name: Bazel repository cache
        # The interpreter, the locked wheels and the @crates sources; keyed on
        # the lockfiles that decide them.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ocx-mirror/bazel-repo
          key: bazel-repo-${{ runner.os }}-${{ hashFiles('MODULE.bazel.lock', 'Cargo.lock', 'docs/requirements.lock') }}
          restore-keys: bazel-repo-${{ runner.os }}-
      # Read-only on every trigger: this workflow never writes the cache, so
      # it binds the read credential alone (a fork has no secrets, the action
      # writes nothing, and the build reads anonymously).
      - name: Bazel cache credential
        uses: ./.github/actions/bazel-cache-rc
        with:
          read-auth: ${{ secrets.BAZEL_CACHE_READ_AUTH }}
      # No lld step: the site graph compiles and links nothing (aquery over
      # //docs:site holds no C++ or Rust action), so no linker reaches a key.
      - name: Build
        run: task docs:build JOBS=auto -- --config=ci
      # A composite action has no `post:` hook; `always()` so a failed or
      # cancelled job leaves no credential on the runner.
      - name: Remove the Bazel cache credential
        if: always()
        uses: ./.github/actions/bazel-cache-rc
        with:
          cleanup: 'true'
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: site/

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
