[package]
name = "ocx_mirror"
description = "Mirror upstream tool releases into OCI registries as OCX packages"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

# Explicit workspace root: anchors the [patch.crates-io] table below, and
# holds every dependency row, package field and lint once for all members
# (`crates/*`, each carrying `[lints] workspace = true`). Which member may
# depend on which is `crates/crate_map.toml`, enforced by
# `tests/workspace_structure.rs`. The vendored ocx checkout is excluded so its
# packages bind to their own workspace root (external/ocx/Cargo.toml) for
# workspace-inherited fields — without the exclude, this workspace claims the
# subtree and inheritance (version.workspace etc.) fails to resolve.
[workspace]
members = ["crates/*"]
exclude = ["external/ocx"]

[workspace.package]
version = "0.6.2"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/ocx-sh/ocx-mirror"
homepage = "https://ocx.sh"
publish = false

[workspace.dependencies]
# ocx is consumed as path dependencies into the ocx git submodule — the same
# easy-to-maintain pattern ocx itself uses for its vendored forks. Bumping ocx
# is still exactly one thing: bumping the external/ocx submodule pointer. What
# changed upstream is the shape of the surface — the single `ocx_lib` crate was
# dissolved into responsibility-derived crates, so the pointer bump now lands
# across the nine rows below instead of one. Each row is a surface this
# binary names directly; a crate the code stops using is a row to delete, not a
# convenience to keep.
#
# Every row is an **ecosystem**- or **interface**-tier crate in ocx's
# stability table (`ocx`'s CLAUDE.md; `ocx_exit` is the interface one). An
# **internal**-tier crate must never get a row: `task satellite:verify` in
# ocx's `verify-deep.yml` asserts this workspace resolves none of them, because
# internal code carries no stability at all and a link to it is a break waiting
# for the next rename. The two that used to be here are the precedent —
# `ocx_shell` (CI annotations, now reached through `ocx package push
# --ci-annotations`) and `ocx_announce` (the forge vocabulary, restated in
# `crates/ocx_mirror_spec/src/forge.rs`, which says why).
#
# Deliberately absent for a different reason: `ocx` itself
# (`external/ocx/crates/ocx_cli`), the CLI *application*. Its `tracing_init`
# and its error -> exit-code ladder are the only two things this binary ever
# wanted from it, and the row cost 160 packages — the whole Starlark host plus
# an LSP/DAP/REPL stack and the gix family — for them. Both now live here:
# `src/tracing_init.rs` (a verbatim copy) and `ocx_mirror_error::tls_exit_code`.
ocx_config = { path = "external/ocx/crates/ocx_config" }
ocx_console = { path = "external/ocx/crates/ocx_console" }
ocx_exit = { path = "external/ocx/crates/ocx_exit" }
ocx_index = { path = "external/ocx/crates/ocx_index" }
ocx_oci = { path = "external/ocx/crates/ocx_oci" }
ocx_package = { path = "external/ocx/crates/ocx_package" }
ocx_sign = { path = "external/ocx/crates/ocx_sign" }
ocx_util = { path = "external/ocx/crates/ocx_util" }
# The PEP 751 lock translation library the `source.type: pylock`/`pypi`
# adapters and the env pipeline call into. Its git-pinned `uv-*` rows live in
# ocx's `[workspace.dependencies]` and move with the pointer; the mirror names
# the uv types through `ocx_python::` and never re-declares them.
ocx_python = { path = "external/ocx/crates/ocx_python" }
# The mirror's own workspace members (`crates/ocx_mirror_*`); which may depend
# on which is `crates/crate_map.toml`.
ocx_mirror_error = { path = "crates/ocx_mirror_error" }
ocx_mirror_http = { path = "crates/ocx_mirror_http" }
ocx_mirror_pipeline = { path = "crates/ocx_mirror_pipeline" }
ocx_mirror_report = { path = "crates/ocx_mirror_report" }
ocx_mirror_source = { path = "crates/ocx_mirror_source" }
ocx_mirror_spec = { path = "crates/ocx_mirror_spec" }
ocx_mirror_test_support = { path = "crates/ocx_mirror_test_support" }

# Feature lists below are copied EXACTLY from ocx's [workspace.dependencies]
# (external/ocx/Cargo.toml). Keep them in sync when bumping the submodule —
# widening defaults here (e.g. reqwest native-tls) would drag openssl into the
# shared dependency graph.
tokio = { version = "1.52", features = ["full"] }
clap = { version = ">=4.5.57, <5", features = ["derive", "color"] }
anyhow = "1.0.102"
# `bytes` matches ocx's pin. The dist uploader holds one archive body per
# in-flight PUT and reqwest consumes it per attempt, so the payload is a
# refcount-cloned `Bytes` rather than a `Vec<u8>` copied on every retry.
bytes = "1.11.1"
futures = "0.3.32"
serde = { version = "1.0.228", features = ["derive"] }
# `preserve_order` is necessary, not belt-and-braces:
# `ocx_index::wire_writer::serialize_root` is a pass-through with no ordering
# enforcement of its own, so without the feature `serde_json::Map` reverts to
# `BTreeMap`, every rewritten index root re-emits in alphabetical key order, and
# `sha256(root bytes)` changes for documents that did not semantically change —
# with no compile error anywhere. Inherited today only through Cargo feature
# unification with `ocx_index`; declared here so it survives an upstream change.
serde_json = { version = "1.0.150", features = ["preserve_order"] }
serde_yaml_ng = "0.10.0"
schemars = "1.2.1"
chrono = "0.4.44"
regex = "1.12.3"
url = { version = "2.5.8", features = ["serde"] }
# Used for the typed `Release` model and route building only: the HTTP stack
# is the mirror's own, injected through `OctocrabBuilder::with_service`
# (`crates/ocx_mirror_source/src/github_release.rs`). octocrab's default
# client is a bare `hyper_util` legacy client that reads no proxy variables and
# trusts the platform store alone, which kept `github_release` discovery
# off-limits behind a corporate proxy. `retry` and `timeout` are dropped with
# it — both only layer onto that default client, and the retry ladder here is
# mirror-owned.
octocrab = { version = "0.51", default-features = false, features = [
    "default-client",
    "follow-redirect",
    "jwt-aws-lc-rs",
    "rustls",
    "rustls-aws-lc-rs",
    "tracing",
] }
# The wire types `octocrab` hands the injected transport, and the `Service`
# trait that transport implements. Both are already in the graph through
# reqwest; named directly because
# `crates/ocx_mirror_source/src/github_release.rs` writes the bridge itself.
# `tower-service` is the trait crate alone — the `tower` middleware stack is
# not linked for it.
http = "1.5"
tower-service = "0.3"
quick-junit = "0.6"
# Same major as ocx's (`external/ocx/Cargo.toml`), so `ocx_oci`'s own reqwest
# types cross the path dependency and one copy of the crate is linked. `rustls`
# resolves to the platform verifier, which reads the host trust store and
# therefore `SSL_CERT_FILE` / `SSL_CERT_DIR`; `crates/ocx_mirror_http/src/lib.rs` seeds the bundled
# Mozilla roots on top so an empty store is still usable. `json` is ours —
# ocx does not need it. `system-proxy` is copied from ocx (0.6.1+): its
# SSRF guard asks reqwest's own proxy matcher which route a dial takes, and the
# matcher must read the same Windows/macOS system settings the client does.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "charset", "http2", "system-proxy"] }
rustls = { version = "0.23.40", default-features = false, features = ["aws-lc-rs", "std"] }
sha2 = "0.11.0"
# `dist sync` announces four checksums on every upload, because Artifactory's
# per-artifact "Client Checksum" is recorded per algorithm and an absent header
# reads as "client did not publish a checksum value". Both are on the same
# RustCrypto `digest` 0.11 line as `sha2`, so the four hashers share one trait.
sha1 = "0.11.0"
md-5 = "0.11.0"
hex = "0.4.3"
tracing = "0.1.44"
# The subscriber `src/tracing_init.rs` installs — a direct row since the mirror
# stopped linking `ocx_cli` for its `tracing_init`. Version and features copied
# EXACTLY from ocx's `[workspace.dependencies]`, and they must keep tracking
# it: the copied module is verbatim ocx code, so a feature ocx relies on and
# this row drops breaks it here and nowhere upstream. `tracing-log` is the
# `LogTracer` bridge that carries `log::error!` records into the subscriber —
# a default, named anyway so it survives a future `default-features = false`.
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "std", "fmt", "json", "registry", "tracing-log"] }
# The `log` facade ocx's library crates emit through, and the one the mirror's
# own `log::warn!`/`log::debug!` call sites use. Named directly because the
# pre-split `ocx_lib::log` — a `pub use tracing_log::log::*` re-export — has no
# successor in the split crates; records still reach the subscriber through the
# `LogTracer` `tracing-subscriber`'s `tracing-log` feature installs. Version and
# features copied from ocx's `[workspace.dependencies]`.
log = { version = "0.4", features = ["std"] }
tempfile = "3.27.0"
# The test seam for `ocx_oci::ssrf::ProxyRules::new` (an explicit
# `Matcher` instead of the ambient proxy environment); copied exactly from
# ocx's `[workspace.dependencies]`.
hyper-util = { version = "0.1", features = ["client-proxy", "client-proxy-system"] }
# `thiserror` matches ocx's pin; the local error enums of the extracted crates
# use it (adr_bazel_crate_split.md § C3).
thiserror = "2.0.18"
# Dev-only: `tests/workspace_structure.rs` reads member manifests as TOML.
# Copied from ocx's [workspace.dependencies].
toml = "1.1.2"

# Deny warnings for workspace members only. Cargo applies --cap-lints to
# registry and git deps but NOT path deps; a blanket RUSTFLAGS=-D warnings
# would promote the vendored forks' upstream warnings to hard errors. Every
# member opts in with `[lints] workspace = true`.
[workspace.lints.rust]
warnings = "deny"

[lib]
name = "ocx_mirror"
path = "src/lib.rs"

[[bin]]
name = "ocx-mirror"
path = "src/main.rs"

[features]
default = []
jsonschema = ["dep:schemars", "ocx_mirror_spec/jsonschema", "ocx_mirror_source/jsonschema"]

[dependencies]
ocx_config.workspace = true
ocx_console.workspace = true
ocx_exit.workspace = true
ocx_index.workspace = true
ocx_oci.workspace = true
ocx_package.workspace = true
ocx_util.workspace = true
ocx_python.workspace = true
ocx_mirror_error.workspace = true
ocx_mirror_http.workspace = true
ocx_mirror_pipeline.workspace = true
ocx_mirror_report.workspace = true
ocx_mirror_source.workspace = true
ocx_mirror_spec.workspace = true
tokio.workspace = true
clap.workspace = true
anyhow.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
schemars = { workspace = true, optional = true }
chrono.workspace = true
regex.workspace = true
url.workspace = true
rustls.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
log.workspace = true
tempfile.workspace = true

[dev-dependencies]
ocx_mirror_test_support.workspace = true
toml.workspace = true

[lints]
workspace = true

# ocx is developed against the ocx-sh forks of oci-client and
# docker_credential via [patch.crates-io] in the ocx workspace. Patch tables
# only apply at the consuming workspace root — they do NOT travel with path or
# git dependencies — so they are re-declared here, pointing into the nested
# submodules of external/ocx. Requires `git submodule update --init --recursive`.
#
# Invariant: the fork versions must keep satisfying ocx's requirements
# (oci-client "0.17", docker_credential "1.3", sigstore "0.14"). A drift surfaces as a hard
# resolution error at `cargo update`. WARNING: dropping this table does NOT
# error — cargo would silently resolve the unpatched crates.io releases.
# CI guards this with `cargo tree -i oci-client` (see verify workflow).
[patch.crates-io]
oci-client = { path = "external/ocx/external/rust-oci-client" }
docker_credential = { path = "external/ocx/external/docker_credential" }
sigstore = { path = "external/ocx/external/sigstore-rs" }
