[package]
name = "ocx_mirror"
version = "0.5.7"
edition = "2024"
license = "Apache-2.0"
description = "Mirror upstream tool releases into OCI registries as OCX packages"
repository = "https://github.com/ocx-sh/ocx-mirror"
homepage = "https://ocx.sh"
publish = false

# Explicit workspace root: anchors the [patch.crates-io] table below. The
# vendored ocx checkout is excluded so its packages bind to their own
# workspace root (external/ocx/Cargo.toml) for workspace-inherited fields —
# without the exclude, this workspace claims the subtree and inheritance
# (version.workspace etc.) fails to resolve.
[workspace]
exclude = ["external/ocx"]

[lib]
name = "ocx_mirror"
path = "src/lib.rs"

[[bin]]
name = "ocx-mirror"
path = "src/main.rs"

[features]
default = []
jsonschema = ["dep:schemars"]

[dependencies]
# ocx_lib is consumed as a path dependency into the ocx git submodule —
# the same easy-to-maintain pattern ocx itself uses for its vendored forks.
# Bumping ocx_lib = bumping the external/ocx submodule pointer.
ocx_lib = { path = "external/ocx/crates/ocx_lib" }
# ocx_python is an in-workspace path dep (crates/ocx_python) — the pylock
# translation library the `source.type: pylock`/`pypi` adapters and the env
# pipeline call into. A path dep inside the workspace directory is a workspace
# member automatically; no [workspace] members table is needed.
ocx_python = { path = "crates/ocx_python" }

# Feature lists below are copied EXACTLY from ocx's [workspace.dependencies]
# (external/ocx/Cargo.toml). Keep them in sync when bumping the submodule —
# widening defaults here (e.g. reqwest native-tls) would drag openssl into the
# shared dependency graph.
tokio = { version = "1.52", features = ["full"] }
clap = { version = ">=4.5.57, <5", features = ["derive", "color"] }
anyhow = "1.0.102"
# `bytes` matches ocx's pin. The dist uploader holds one archive body per
# in-flight PUT and reqwest consumes it per attempt, so the payload is a
# refcount-cloned `Bytes` rather than a `Vec<u8>` copied on every retry.
bytes = "1.11.1"
futures = "0.3.32"
serde = { version = "1.0.228", features = ["derive"] }
# `preserve_order` is necessary, not belt-and-braces: `ocx_lib`'s
# `wire_writer::serialize_root` is a pass-through with no ordering enforcement
# of its own, so without the feature `serde_json::Map` reverts to `BTreeMap`,
# every rewritten index root re-emits in alphabetical key order, and
# `sha256(root bytes)` changes for documents that did not semantically change —
# with no compile error anywhere. Inherited today only through Cargo feature
# unification with `ocx_lib`; declared here so it survives an upstream change.
serde_json = { version = "1.0.150", features = ["preserve_order"] }
serde_yaml_ng = "0.10.0"
schemars = { version = "1.2.1", optional = true }
chrono = "0.4.44"
regex = "1.12.3"
url = { version = "2.5.8", features = ["serde"] }
octocrab = { version = "0.51", default-features = false, features = [
    "default-client",
    "follow-redirect",
    "jwt-aws-lc-rs",
    "retry",
    "rustls",
    "rustls-aws-lc-rs",
    "timeout",
    "tracing",
] }
quick-junit = "0.6"
# Same major as ocx's (`external/ocx/Cargo.toml`), so `ocx_lib`'s own reqwest
# types cross the path dependency and one copy of the crate is linked. `rustls`
# resolves to the platform verifier, which reads the host trust store and
# therefore `SSL_CERT_FILE` / `SSL_CERT_DIR`; `src/http.rs` seeds the bundled
# Mozilla roots on top so an empty store is still usable. `json` is ours —
# `ocx_lib` does not need it. Deliberately not `system-proxy`: that feature is
# the Windows/macOS system *settings* reader, and the `HTTP_PROXY` family is
# honoured without it.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "charset", "http2"] }
rustls = { version = "0.23.40", default-features = false, features = ["aws-lc-rs", "std"] }
sha2 = "0.11.0"
# `dist sync` announces four checksums on every upload, because Artifactory's
# per-artifact "Client Checksum" is recorded per algorithm and an absent header
# reads as "client did not publish a checksum value". Both are on the same
# RustCrypto `digest` 0.11 line as `sha2`, so the four hashers share one trait.
sha1 = "0.11.0"
md-5 = "0.11.0"
hex = "0.4.3"
tracing = "0.1.44"
tempfile = "3.27.0"

[dev-dependencies]
tokio = { version = "1.52", features = ["full", "test-util"] }
# Already in the graph transitively via reqwest; taken as a direct dev-dep so a
# unit test can synthesize the `reqwest`-wrapped 429 the HEAD presence probe
# emits (`is_rate_limited`) — reqwest exposes no other constructor for an
# `Error` carrying a status.
http = "1.4.2"

# ocx_lib is developed against the ocx-sh forks of oci-client and
# docker_credential via [patch.crates-io] in the ocx workspace. Patch tables
# only apply at the consuming workspace root — they do NOT travel with path or
# git dependencies — so they are re-declared here, pointing into the nested
# submodules of external/ocx. Requires `git submodule update --init --recursive`.
#
# Invariant: the fork versions must keep satisfying ocx_lib's requirements
# (oci-client "0.17", docker_credential "1.3"). A drift surfaces as a hard
# resolution error at `cargo update`. WARNING: dropping this table does NOT
# error — cargo would silently resolve the unpatched crates.io releases.
# CI guards this with `cargo tree -i oci-client` (see verify workflow).
[patch.crates-io]
oci-client = { path = "external/ocx/external/rust-oci-client" }
docker_credential = { path = "external/ocx/external/docker_credential" }

# Deny warnings for this package only. Cargo applies --cap-lints to registry
# and git deps but NOT path deps; a blanket RUSTFLAGS=-D warnings would
# promote the vendored forks' upstream warnings to hard errors.
[lints.rust]
warnings = "deny"
