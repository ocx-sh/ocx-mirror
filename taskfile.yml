# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

vars:
  REPORTS_ROOT: '{{.ROOT_DIR}}/target/reports'

includes:
  baseline:
    taskfile: ./taskfiles/baseline.taskfile.yml
    flatten: true
  rust: ./taskfiles/rust.taskfile.yml
  release: ./taskfiles/release.taskfile.yml
  docs: ./taskfiles/docs.taskfile.yml
  git: ./taskfiles/git.taskfile.yml
  bazel: ./taskfiles/bazel.taskfile.yml
  telemetry: ./taskfiles/telemetry.taskfile.yml
  claude:
    taskfile: ./.claude/taskfile.yml
    dir: ./.claude
  test:
    taskfile: ./test/taskfile.yml
    dir: ./test

tasks:
  ocx:index-update:
    desc: Updates this repository's index lock.
    cmds:
      - rm -rf .ocx/index
      - ocx index update go-task:3 git-cliff:2 uv:0 lychee:0 ocx/cli:0.5.6

  checkpoint:
    cmds:
      - if: '! [[ $(git show -s --format=%s HEAD) == "Checkpoint" ]]'
        cmd: git commit --allow-empty -m "Checkpoint"
      - cmd: git add .
      - cmd: git commit --amend --no-edit --allow-empty

  check:
    cmd: cargo check

  run:
    desc: Build and run ocx-mirror (pass args after --)
    cmd: cargo run --release --bin ocx-mirror -- {{.CLI_ARGS}}

  default:
    deps:
      - task: rust:format:check
      - task: rust:clippy:check
      - task: check

  # Shared internal helpers (called by subsystem taskfiles via :prefix)
  # Convention: dot-prefix (.name) for internal tasks, like GitLab CI hidden jobs.
  .ensure-cargo-tool:
    internal: true
    status:
      - '{{.TOOL}} --version'
    cmds:
      - cargo install --locked {{.CRATE | default .TOOL}}

  scripts:self-test:
    desc: Prove every gate script red and green — on Linux all 17 `scripts/BUILD.bazel` tests (the nine `--self-test`s, the bazel-cache-rc selftest.sh, the telemetry pytest, and the release pytests for prune-select, SBOM, ocx identity, backfill, mirror publish and the workflow guards); darwin and windows run the `--self-test` gates only
    cmds:
      # Linux: as cached Bazel tests (scripts/BUILD.bazel, with the telemetry
      # pytest); elsewhere the plain python list below. Each is a no-op off
      # its own platforms.
      - task: bazel:test:scripts
      - task: .scripts:self-test:python

  .scripts:self-test:python:
    internal: true
    platforms: [darwin, windows]
    dir: '{{.ROOT_DIR}}'
    cmds:
      - python3 scripts/accept_floor.py --self-test
      - python3 scripts/bazel_test_floor.py --self-test
      - python3 scripts/bazel_build_drift.py --self-test
      - python3 scripts/bazel_cache_check.py --self-test
      - python3 scripts/bazel_scoped.py --self-test
      - python3 scripts/bazel_execlog_keys.py --self-test
      - python3 scripts/bazel_tag_guard.py --self-test
      - python3 scripts/bep_to_otlp.py --self-test
      - python3 scripts/release_readiness_gate.py --self-test
      # ocx's scripts.taskfile.yml wires it the same way: it lives under
      # `.github/actions/`, not `scripts/`, so a list of `scripts/*.py` alone
      # would never run it. Bare `bash`, no network, no real credential, ~1 s.
      - bash .github/actions/bazel-cache-rc/selftest.sh

  # The tier aliases the conventions baseline's workflows call (`verify-basic.yml`
  # runs ci:lint / ci:test / ci:build / ci:docs, `verify-deep.yml` ci:deep). They are
  # the Linux CI arms of `task verify`, split so a tier can be re-run alone; every
  # Bazel call passes `--config=ci` (.bazelrc: minimal downloads, test reports kept)
  # and `JOBS=auto`. The Bazel acceptance suite and the sharded native run are
  # repo-owned jobs in basic-repo.yml, not a tier.
  # The baseline's commit-msg gate, widened by the rolling `Checkpoint` commit (`task checkpoint`,
  # /commit's working phase) that /finalize rewrites into conventional commits before landing.
  hooks:repo-commit-msg:
    desc: "commit-msg gate: a conventional subject, or the rolling Checkpoint (arg: the message file)"
    silent: true
    cmds:
      - cmd: |
          read -r msg < {{.CLI_ARGS}} || true
          case "$msg" in Merge\ *|Revert\ \"*|Checkpoint) exit 0 ;; esac
          re='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([^)]+\))?!?: .+'
          if [[ $msg =~ $re ]]; then exit 0; fi
          echo "commit subject must be '<type>[(scope)][!]: <subject>' (type: feat fix docs style refactor perf test build ci chore revert) or 'Checkpoint'" >&2
          exit 1

  # Ahead of the first Bazel command of a CI job: the C++ toolchain is autoconfigured once per output
  # base and bakes `lld` in as the linker when it exists. The runner image has gold and no `ld.lld`, and
  # the linker is part of every link's action key, so without it these lanes miss the cache the other
  # lanes (and ocx) share. A no-op off CI and where lld is already installed.
  .ci:lld:
    internal: true
    platforms: [linux]
    status:
      - '[ "${CI:-}" != true ] || command -v ld.lld >/dev/null'
    cmds:
      - sudo apt-get update && sudo apt-get install -y lld

  ci:lint:
    desc: 'Lint tier: fmt + clippy, licenses, claude hooks, Bazel static gates (pin, lint, lockfile, fork patches, BUILD drift, tag guard, graph load)'
    cmds:
      - task: .ci:lld
      - task: rust:lint
      - task: rust:license:check
      - task: rust:license:deps
      - task: claude:hooks:test
      - task: bazel:pin:check
      - task: bazel:lint
      - task: bazel:mod:check
      - task: bazel:patch:check
      - task: bazel:build:nobuild
        vars: {JOBS: auto}
      - task: bazel:build:drift
        vars: {JOBS: auto}
      - task: bazel:tag:guard

  ci:test:
    desc: 'Test tier: gate-script self-tests, Bazel unit tests, the coverage floor (JUnit to target/reports/junit/)'
    cmds:
      - task: .ci:lld
      - task: bazel:test:scripts
        vars: {JOBS: auto, CLI_ARGS: '--config=ci'}
      - task: bazel:test:unit
        vars: {JOBS: auto, CLI_ARGS: '--config=ci'}
      - task: bazel:test:coverage
        vars: {JOBS: auto, CLI_ARGS: '--config=ci'}
      # The per-case report `bazel:test:unit` writes, where the template's test job reads it.
      - cmd: |
          mkdir -p target/reports/junit
          if [ -f target/bazel/junit.xml ]; then cp target/bazel/junit.xml target/reports/junit/unit.xml; fi
        silent: true

  ci:build:
    desc: 'Build tier: the jsonschema feature graph'
    cmds:
      - task: .ci:lld
      - task: bazel:build:jsonschema
        vars: {JOBS: auto, CLI_ARGS: '--config=ci'}

  ci:docs:
    desc: Docs tier — the Bazel mkdocs --strict site build (//docs:site); no Lighthouse gate, the site has no deploy
    cmds:
      - task: docs:build
        vars: {JOBS: auto, CLI_ARGS: '--config=ci'}

  ci:deep:
    desc: Deep tier — n/a here; the release build matrix is a repo-owned job in deep-repo.yml
    cmds:
      - mkdir -p target/reports/junit
      - echo "n/a - the deep tier is deep-repo.yml (release build matrix)"

  verify:scoped:
    desc: Scoped gate for agents and quick loops — tests only what the change reaches (Bazel rdeps vs origin/main), claude hooks, baseline contract; never the full `task verify`
    cmds:
      - task: bazel:test:scoped
      - task: claude:hooks:test
      - task: baseline:check

  # Two-phase verify: parallel lint, then sequential build+test
  verify:
    desc: Full quality gate (CI runs it sharded; agents run `verify:scoped`, not this)
    summary: |
      Phase 1 (parallel): rustfmt + clippy (`rust:lint` — the Bazel lanes on
        Linux, cargo elsewhere); off Linux also the gate-script and telemetry
        self-tests
      Phase 2 (sequential; adr_bazel_crate_split.md § C8):
        Linux — license headers, dependency licenses, claude hooks test,
          the Bazel static gates
          (pin, lint, lockfile, fork patches, BUILD drift, tag guard), the
          Bazel jsonschema feature build, the gate-script + telemetry
          self-tests (Bazel), Bazel unit tests, the Bazel coverage gate,
          Bazel acceptance.
        elsewhere — license headers, dependency licenses, jsonschema feature,
          cargo release build (`__testing`), claude hooks test, nextest unit tests,
          acceptance tests.
      Phase 1's lint finishes before phase 2's cargo build starts.
      Use `task --force verify` to bypass caching.
      Use `task --status verify` to check freshness without running.
    cmds:
      - task: .verify:lint
      - task: .verify:build-test

  .verify:lint:
    internal: true
    deps:
      - task: rust:lint
      # Off Linux only: on Linux both are `bazel:test:scripts`, in phase 2,
      # so no Bazel command starts while clippy builds.
      - task: .scripts:self-test:python
      - task: telemetry:self-test:python

  .verify:build-test:
    internal: true
    cmds:
      - task: rust:license:check
      - task: rust:license:deps
      # Linux: `bazel:build:jsonschema` in .verify:test:linux.
      - task: rust:jsonschema:check
        if: '[ "{{OS}}" != linux ]'
      # Linux tests the Bazel-built //:ocx-mirror; the cargo release build
      # feeds only the non-Linux `test:parallel`.
      - task: rust:build
        if: '[ "{{OS}}" != linux ]'
      - task: claude:hooks:test
      # `if:`, not `platforms:` — go-task 3.53 ignores `platforms:` on a
      # `task:` call (measured), and would run both arms.
      - task: .verify:test:linux
        if: '[ "{{OS}}" = linux ]'
      - task: rust:test:unit
        if: '[ "{{OS}}" != linux ]'
      - task: test:parallel
        if: '[ "{{OS}}" != linux ]'

  .verify:test:linux:
    internal: true
    cmds:
      - task: bazel:pin:check
      - task: bazel:lint
      - task: bazel:mod:check
      - task: bazel:patch:check
      - task: bazel:build:drift
      - task: bazel:tag:guard
      - task: bazel:build:jsonschema
      - task: bazel:test:scripts
      - task: bazel:test:unit
      - task: bazel:test:coverage
      - task: bazel:test:accept
