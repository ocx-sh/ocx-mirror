# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

vars:
  REPORTS_ROOT: '{{.ROOT_DIR}}/target/reports'

includes:
  rust: ./taskfiles/rust.taskfile.yml
  release: ./taskfiles/release.taskfile.yml
  docs: ./taskfiles/docs.taskfile.yml
  git: ./taskfiles/git.taskfile.yml
  bazel: ./taskfiles/bazel.taskfile.yml
  telemetry: ./taskfiles/telemetry.taskfile.yml
  claude:
    taskfile: ./.claude/taskfile.yml
    dir: ./.claude
  test:
    taskfile: ./test/taskfile.yml
    dir: ./test

tasks:
  ocx:index-update:
    desc: Updates this repository's index lock.
    cmds:
      - rm -rf .ocx/index
      - ocx index update go-task:3 git-cliff:2 uv:0 lychee:0 ocx/cli:0.5.6

  checkpoint:
    cmds:
      - if: '! [[ $(git show -s --format=%s HEAD) == "Checkpoint" ]]'
        cmd: git commit --allow-empty -m "Checkpoint"
      - cmd: git add .
      - cmd: git commit --amend --no-edit --allow-empty

  check:
    cmd: cargo check

  run:
    desc: Build and run ocx-mirror (pass args after --)
    cmd: cargo run --release --bin ocx-mirror -- {{.CLI_ARGS}}

  default:
    deps:
      - task: rust:format:check
      - task: rust:clippy:check
      - task: check

  # Shared internal helpers (called by subsystem taskfiles via :prefix)
  # Convention: dot-prefix (.name) for internal tasks, like GitLab CI hidden jobs.
  .ensure-cargo-tool:
    internal: true
    status:
      - '{{.TOOL}} --version'
    cmds:
      - cargo install --locked {{.CRATE | default .TOOL}}

  scripts:self-test:
    desc: Prove every gate script red and green — the `--self-test` of bazel_test_floor, bazel_build_drift, bazel_cache_check, bep_to_otlp
    dir: '{{.ROOT_DIR}}'
    cmds:
      - python3 scripts/bazel_test_floor.py --self-test
      - python3 scripts/bazel_build_drift.py --self-test
      - python3 scripts/bazel_cache_check.py --self-test
      - python3 scripts/bep_to_otlp.py --self-test

  # Two-phase verify: parallel lint, then sequential build+test
  verify:
    desc: Full quality gate
    summary: |
      Phase 1 (parallel): format, clippy, gate-script self-tests, telemetry self-test
      Phase 2 (sequential; adr_bazel_crate_split.md § C8):
        Linux — license headers, dependency licenses, jsonschema feature,
          cargo release build (the shipped artifact), claude hooks test, the
          Bazel static gates (pin, lint, lockfile, fork patches, BUILD drift),
          Bazel unit tests, the Bazel coverage gate, the Bazel-excluded rows
          under nextest, Bazel acceptance.
        elsewhere — license headers, dependency licenses, jsonschema feature,
          cargo release build, claude hooks test, nextest unit tests,
          acceptance tests.
      Clippy (phase 1) finishes before any Bazel command (phase 2) starts.
      Use `task --force verify` to bypass caching.
      Use `task --status verify` to check freshness without running.
    cmds:
      - task: .verify:lint
      - task: .verify:build-test

  .verify:lint:
    internal: true
    deps:
      - task: rust:format:check
      - task: rust:clippy:check
      - task: scripts:self-test
      - task: telemetry:self-test

  .verify:build-test:
    internal: true
    cmds:
      - task: rust:license:check
      - task: rust:license:deps
      - task: rust:jsonschema:check
      - task: rust:build
      - task: claude:hooks:test
      # `if:`, not `platforms:` — go-task 3.53 ignores `platforms:` on a
      # `task:` call (measured), and would run both arms.
      - task: .verify:test:linux
        if: '[ "{{OS}}" = linux ]'
      - task: rust:test:unit
        if: '[ "{{OS}}" != linux ]'
      - task: test:parallel
        if: '[ "{{OS}}" != linux ]'

  .verify:test:linux:
    internal: true
    cmds:
      - task: bazel:pin:check
      - task: bazel:lint
      - task: bazel:mod:check
      - task: bazel:patch:check
      - task: bazel:build:drift
      - task: bazel:test:unit
      - task: bazel:test:coverage
      - task: rust:test:bazel-excluded
      - task: bazel:test:accept
