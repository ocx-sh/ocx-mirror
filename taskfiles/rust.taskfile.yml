# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

x-shared:
  rust-sources: &rust-sources
    - '{{.ROOT_DIR}}/src/**/*.rs'
    - '{{.ROOT_DIR}}/tests/**/*'
    - '{{.ROOT_DIR}}/crates/**/*.rs'
    - '{{.ROOT_DIR}}/crates/**/Cargo.toml'
    - '{{.ROOT_DIR}}/crates/crate_map.toml'
    - '{{.ROOT_DIR}}/Cargo.toml'
    - '{{.ROOT_DIR}}/Cargo.lock'
    - '{{.ROOT_DIR}}/build.rs'
    - '{{.ROOT_DIR}}/testing_provenance.env'
    - '{{.ROOT_DIR}}/rustfmt.toml'
    - exclude: '{{.ROOT_DIR}}/target/**'
    - exclude: '{{.ROOT_DIR}}/external/**'
  # The files rustfmt sees: tracked plus untracked-not-ignored `.rs`, which
  # never includes external/ocx (a gitlink). Not `cargo fmt --all`: that also
  # formats every local path dependency — measured, 39 files under
  # external/ocx/crates — and the vendored submodule is never reformatted
  # here. rustfmt finds rustfmt.toml from each file's directory.
  rust-files: &rust-files
    RUST_FILES:
      sh: git -C '{{.ROOT_DIR}}' ls-files --cached --others --exclude-standard -- '*.rs' ':!:external/**' | sed "s|^|{{.ROOT_DIR}}/|" | tr '\n' ' '

tasks:
  verify:
    desc: Rust loop gate (format, clippy, BUILD drift on Linux, unit tests — Bazel on Linux, cargo elsewhere)
    summary: |
      adr_bazel_crate_split.md § C8, adr_bazel_full_adoption.md § C5 —
      sequential, fail-fast:
        1. lint — rustfmt and clippy: the Bazel lanes on Linux, cargo elsewhere
        2. Linux: `bazel:build:drift` — no build. Reds on a Cargo test target
           (a new `tests/foo.rs`, a crate's first `tests/`) with no
           `rust_test`, which the Bazel run below would never notice.
        3. test:unit — `bazel:test:unit` on Linux, `rust:test:nextest` elsewhere
      Use during review-fix loops when only Rust code changed; license,
      jsonschema, the release build and acceptance are `task verify`'s.
    cmds:
      - task: lint
      # `if:`, not `platforms:` — see test:unit.
      - task: :bazel:build:drift
        if: '[ "{{OS}}" = linux ]'
      - task: test:unit

  lint:
    desc: rustfmt + clippy checks — `bazel:lint:fmt` and `bazel:lint:clippy` on Linux, cargo elsewhere
    summary: |
      adr_bazel_full_adoption.md § C5: Bazel owns the Linux lanes, CI's
      included; macOS and Windows keep `format:check` and `clippy:check`,
      as they keep nextest. Sequential either way — one Bazel server, and
      cargo never builds beside it.
    cmds:
      - task: :bazel:lint:fmt
        if: '[ "{{OS}}" = linux ]'
      - task: :bazel:lint:clippy
        if: '[ "{{OS}}" = linux ]'
      - task: format:check
        if: '[ "{{OS}}" != linux ]'
      - task: clippy:check
        if: '[ "{{OS}}" != linux ]'

  format:check:
    desc: Check Rust formatting (the macOS/Windows arm; `bazel:lint:fmt` on Linux)
    sources: *rust-sources
    vars: *rust-files
    cmd: rustfmt --edition 2024 --check {{.RUST_FILES}}

  format:apply:
    desc: Apply Rust formatting to every tracked or new first-party `.rs`
    vars: *rust-files
    cmd: rustfmt --edition 2024 {{.RUST_FILES}}

  clippy:check:
    desc: Run clippy linter
    sources: *rust-sources
    cmd: cargo clippy --workspace --locked --all-targets -- -D warnings

  clippy:fix:
    desc: Auto-fix clippy warnings
    cmd: cargo clippy --workspace --locked --all-targets --fix --allow-dirty

  jsonschema:check:
    desc: Type-check the optional `jsonschema` feature with cargo (`bazel:build:jsonschema` is the Linux lane)
    summary: |
      The `schema` command and every `schemars` derive live behind the
      `jsonschema` feature, which no other task and no CI job builds — so a
      derive that stopped compiling stayed green until someone ran
      `ocx-mirror schema` by hand. `--all-targets` so the feature-gated tests
      are type-checked too, and `--workspace` because those tests live in the
      member crates that own the derives (ocx_mirror_spec's dist schema test).
    sources: *rust-sources
    cmd: cargo check --workspace --locked --features jsonschema --all-targets

  build:
    desc: Build the release-profile test binary (`--features __testing`)
    summary: |
      The binary acceptance runs (non-Linux `task test:parallel`, CI's
      Acceptance job). `__testing` bakes fixed placeholder provenance instead
      of the commit, dirty flag and CI variables (`build.rs`), so the binary
      does not change per commit. Shipped binaries come from
      `.github/workflows/build-matrix.yml`, which enables no feature.
    sources: *rust-sources
    status:
      - test -f {{.ROOT_DIR}}/target/release/ocx-mirror
    method: timestamp
    cmd: cargo build --release --locked --features __testing

  install:nextest:
    internal: true
    cmds:
      - task: :.ensure-cargo-tool
        vars: { TOOL: cargo-nextest, CRATE: cargo-nextest }

  test:unit:
    desc: Run unit tests — `bazel:test:unit` on Linux, `rust:test:nextest` elsewhere
    summary: |
      adr_bazel_crate_split.md § C8: dispatch on OS only. Bazel is the Linux
      loop, and CI's unit lane (verify.yml `Unit tests (Bazel)` calls
      `bazel:test:unit` by name); macOS and Windows stay on cargo nextest,
      as in ocx. `{{.CLI_ARGS}}` reaches
      whichever arm runs — nextest flags off Linux, Bazel flags on it.
    # No `sources:` — Bazel's action cache decides what re-executes, and a
    # fingerprint over the Rust sources alone would serve a stale green after
    # a BUILD.bazel or MODULE.bazel edit.
    # `if:`, not `platforms:` — go-task 3.53 ignores `platforms:` on a
    # `task:` call (measured), and would run both arms.
    cmds:
      - task: :bazel:test:unit
        if: '[ "{{OS}}" = linux ]'
      - task: test:nextest
        if: '[ "{{OS}}" != linux ]'

  test:nextest:
    desc: Unit tests under cargo nextest, then push the per-test JUnit to telemetry
    summary: |
      `test:unit`'s body (the non-Linux lane, adr_bazel_crate_split.md
      § C8), plus plan D-B5: local unit telemetry comes from nextest only.
      `.config/nextest.toml` writes the default profile's JUnit; the push is a
      silent no-op unless this machine is configured for it. That report is
      deleted before the run, so a `-- --profile ci` run (which writes
      target/nextest/ci/) leaves nothing here and pushes nothing — never a
      stale default-profile report. CI runs no nextest: its unit lane is
      `bazel:test:unit`.
    deps:
      - install:nextest
    cmds:
      # --workspace: the root package plus every crates/* member (external/ocx
      # is workspace-excluded); without it only the root package's tests run.
      # `ocx_mirror/__testing`: the same feature set as `rust:build`, so this
      # release build reuses its artifacts instead of relinking
      # target/release/ocx-mirror without the placeholders.
      - rm -f '{{.ROOT_DIR}}/target/nextest/default/junit.xml'
      - cargo nextest run --workspace --release --locked --features ocx_mirror/__testing {{.CLI_ARGS}}
      - task: :telemetry:push
        vars:
          JUNIT: '{{.ROOT_DIR}}/target/nextest/default/junit.xml'
          SUITE: unit

  install:hawkeye:
    internal: true
    cmds:
      - task: :.ensure-cargo-tool
        vars: { TOOL: hawkeye, CRATE: hawkeye }

  install:cargo-deny:
    internal: true
    cmds:
      - task: :.ensure-cargo-tool
        vars: { TOOL: cargo-deny, CRATE: cargo-deny }

  license:check:
    desc: Check license headers on all source files
    deps:
      - install:hawkeye
    cmd: hawkeye check

  license:format:
    desc: Add or fix license headers on all source files
    deps:
      - install:hawkeye
    cmd: hawkeye format

  license:deps:
    desc: Audit dependency licenses with cargo-deny
    deps:
      - install:cargo-deny
    cmd: cargo deny check licenses
