# yaml-language-server: $schema=https://taskfile.dev/schema.json
#
# The Bazel lane — the Linux dev loop and CI's `Smoke (Linux)` job
# (adr_bazel_crate_split.md § C7, C8, A-4, A-8). Ported from ocx's
# taskfiles/bazel.taskfile.yml, remote-cache credential wiring included; ocx's
# `doctor` (a 1.7k-line host probe of ocx's own paths) is not carried.
#
# Every Bazel call goes through `ocx exec bazel -- bazel …` (the `bazel` row in
# ocx.toml) and passes `--jobs={{.JOBS}}` where the command takes it: the host
# ~/.bazelrc outranks the workspace rc. CI passes JOBS=auto.
#
# `{{.BAZEL}}` drops the telemetry credential from the client environment:
# Bazel writes that environment into every BEP and hands it to repository
# rules. `telemetry:bazel` still reads both from the task env.
#
# Tasks CI calls append `{{.CLI_ARGS}}` after the command word, so the CI workflows
# can hand a *build* option through — `--config=ci`, the execution log, and on
# the `main` push alone `--remote_upload_local_results=true`.
#
# Gates are `cmds:`, never `preconditions:` or `status:` — `task --force`
# skips those, and a cached green cannot be told from a gate that never ran.

version: '3'

vars:
  JOBS: '{{.JOBS | default "6"}}'
  OCX_DIR: '{{.ROOT_DIR}}/external/ocx'
  NO_OTEL: env -u OTEL_EXPORTER_OTLP_HEADERS -u OTEL_EXPORTER_OTLP_ENDPOINT
  # `--bazelrc=$RUNNER_TEMP/bazel-cache.rc`, or the empty string — ocx's
  # `CACHE_RC`, verbatim in its derivation. That file is the cache credential
  # `.github/actions/bazel-cache-rc` writes; without it a CI request to the
  # shared cache is an anonymous 401 and the lane compiles cold.
  #
  # **Derived from the file existing, never from a lane naming it.** `--bazelrc`
  # on a missing path is a HARD error (ocx measured on 9.2.0: exit 2, `Unable
  # to read .bazelrc file`), a fork PR is given no secrets so the action writes
  # nothing, and a developer shell has no $RUNNER_TEMP (its read credential is
  # a `--remote_header` in ~/.bazelrc). It is a *startup* option, so it sits
  # before the command word; it adds to the workspace rc, it does not replace
  # it, so `--remote_upload_local_results=false` still holds on every lane.
  #
  # `printf '%s'`, never `printf -- '%s'`: go-task's `sh:` shell (mvdan/sh)
  # takes `--` as the format string and emits two dashes, silently dropping the
  # credential (ocx measured it through `task --dry`).
  #
  # Divergence from ocx: ocx computes it in `test:unit` and `test:accept` alone;
  # here it is part of `{{.BAZEL}}`, so every Bazel command of the CI job runs
  # with one startup-option set (one server, and `bazel:lint`'s buildifier
  # build reads the cache too).
  #
  # ponytail: unquoted at the expansion — `$RUNNER_TEMP` is
  # `/home/runner/work/_temp` on every GitHub runner. A path with a space would
  # need the flag built inside each `cmd:` body.
  #
  # A Windows runner's $RUNNER_TEMP is `D:\a\_temp`: the unquoted expansion
  # would eat its backslashes, so they become slashes (a no-op elsewhere).
  CACHE_RC:
    sh: rc="${RUNNER_TEMP:-/nonexistent}/bazel-cache.rc"; test -f "$rc" && printf '%s' "--bazelrc=${rc//\\//}" || true
  BAZEL: '{{.NO_OTEL}} ocx exec bazel -- bazel {{.CACHE_RC}}'

tasks:
  bep:mode:
    internal: true
    desc: Pin a BEP scratch directory to 0700 and prove it before anything writes into it
    summary: |
      The Build Event Protocol stream carries the whole client environment and
      every rc flag value (the host rc holds a --remote_header credential), so
      the directory must be ours alone. `mktemp -d` is 0700 on GNU coreutils;
      the read-back is what reds on a mktemp or filesystem that is not.
    cmd: >-
      chmod 700 '{{.DIR}}' && python3 -c "import os,sys; m = os.stat(sys.argv[1]).st_mode & 0o777; sys.exit(0 if m == 0o700 else f'bazel: the BEP scratch directory {sys.argv[1]} is mode {m:04o}, not 0700 - the BEP carries the client environment. Point TMPDIR at a filesystem that honours modes.')" '{{.DIR}}'

  bootstrap:
    desc: Make this checkout buildable — fail on a dirty external/ocx tree (rules_rs renders nothing into the source tree, so there is nothing to repin or restore)
    silent: true
    # `task verify` reaches it from seven gates; it takes no per-caller vars.
    run: once
    dir: '{{.ROOT_DIR}}'
    cmds:
      - cmd: |
          set -euo pipefail
          O='{{.OCX_DIR}}'
          d=$(git -C "$O" status --porcelain --untracked-files=all)
          if [ -n "$d" ]; then
            printf 'bazel: the external/ocx submodule tree is not clean:\n%s\n' "$d" >&2
            exit 1
          fi

  build:
    desc: Build every target (`bazel build //...`)
    dir: '{{.ROOT_DIR}}'
    cmds:
      - task: bootstrap
      - '{{.BAZEL}} build --jobs={{.JOBS}} //...'

  build:test-binary:
    desc: Build //:ocx-mirror (the `__testing` placeholders) and stage it at test/bin/ocx-mirror for `test:accept:native`
    dir: '{{.ROOT_DIR}}'
    platforms: [linux]
    cmds:
      - task: bootstrap
      # The download flag stays after CLI_ARGS: CI's `--config=ci` expands to minimal in place, and a cached run then leaves no binary for the cp.
      - '{{.BAZEL}} build --jobs={{.JOBS}} {{.CLI_ARGS}} --remote_download_outputs=toplevel //:ocx-mirror'
      - mkdir -p test/bin
      - cp -L bazel-bin/ocx-mirror test/bin/ocx-mirror

  build:release:
    desc: The release binary for TARGET (one of six rules_rs triples, default x86_64-unknown-linux-musl), real provenance, at target/bazel/release/ocx-mirror-<TARGET>[.exe]
    summary: |
      `//:ocx-mirror` for `-c opt --platforms=@rules_rs//rs/platforms:<TARGET>`
      with the provenance build.rs bakes under cargo (release/BUILD.bazel):
      git from this checkout, `__OCX_BUILD_VERSION`, `__OCX_BUILD_CHANNEL`,
      `CI` and `GITHUB_*` from this environment, read by
      release/workspace_status.py. The flags live here, not in .bazelrc:
      `bazel:tag:guard` keeps `--workspace_status_command` out of the
      checked-in rc.

      Every triple cross-builds from one Linux host (llvm toolchain, rules_rs).
      Always `-c opt`: a fastbuild Windows binary overflows its 1 MiB stack.

      Never a cached lane: the provenance action is `no-remote-cache`, and no
      release caller passes the upload grant. The compiles it does not feed
      read the shared cache like any other build. Its own output directory
      (`--experimental_platform_in_output_dir`), so a release build does not
      overwrite the host outputs the test lanes read.

      The copy is decided on the file cquery names, never on bazel-bin.
    dir: '{{.ROOT_DIR}}'
    platforms: [linux]
    vars:
      TARGET: '{{.TARGET | default "x86_64-unknown-linux-musl"}}'
      FLAGS: >-
        -c opt
        --platforms=@rules_rs//rs/platforms:{{.TARGET}}
        --experimental_platform_in_output_dir=yes
        --define=ocx_mirror_provenance=release
        '--workspace_status_command=python3 release/workspace_status.py'
      OUT: '{{.ROOT_DIR}}/target/bazel/release/ocx-mirror-{{.TARGET}}{{if contains "windows" .TARGET}}.exe{{end}}'
    cmds:
      - cmd: |
          set -euo pipefail
          printf '%s\n' x86_64-unknown-linux-musl aarch64-unknown-linux-musl x86_64-apple-darwin aarch64-apple-darwin x86_64-pc-windows-gnullvm aarch64-pc-windows-gnullvm | grep -qx -- '{{.TARGET}}' || {
            echo "unsupported TARGET '{{.TARGET}}'; one of: x86_64-unknown-linux-musl aarch64-unknown-linux-musl x86_64-apple-darwin aarch64-apple-darwin x86_64-pc-windows-gnullvm aarch64-pc-windows-gnullvm" >&2
            exit 1
          }
      - task: bootstrap
      - '{{.BAZEL}} build --jobs={{.JOBS}} {{.FLAGS}} //:ocx-mirror {{.CLI_ARGS}}'
      - cmd: |
          set -euo pipefail
          bin=$({{.BAZEL}} cquery {{.FLAGS}} --output=files //:ocx-mirror {{.CLI_ARGS}} | tail -n1)
          mkdir -p "$(dirname '{{.OUT}}')"
          cp -f "$bin" '{{.OUT}}'
          echo '{{.OUT}}'

  build:nobuild:
    desc: Load and analyse every target without building; push the analysis BEP to telemetry
    summary: |
      A-8 / C-005. The BEP holds the whole client environment, so it goes into
      a 0700 `mktemp -d` outside the checkout, is 0600 once written, and the
      `defer` (armed first) removes it on every exit. `test -s` blocks a
      dropped --build_event_json_file flag; the telemetry push never blocks.
    dir: '{{.ROOT_DIR}}'
    vars:
      BEP_DIR:
        sh: mktemp -d -t ocx-mirror-bep.XXXXXXXX
      BEP: '{{.BEP_DIR}}/bep.json'
    cmds:
      - defer: rm -rf '{{.BEP_DIR}}'
      - task: bep:mode
        vars: {DIR: '{{.BEP_DIR}}'}
      - task: bootstrap
      - '{{.BAZEL}} build --nobuild --jobs={{.JOBS}} --build_event_json_file={{.BEP}} //...'
      - cmd: >-
          test -s {{.BEP}} || {
          echo 'bazel: --build_event_json_file wrote nothing to {{.BEP}} - restore the flag on the build above.' >&2;
          exit 1; };
          chmod 600 {{.BEP}}
      - task: :telemetry:bazel
        vars:
          BEP: '{{.BEP}}'

  test:
    desc: The whole Bazel test lane — gate-script proofs, unit, the C4 coverage gate, then acceptance
    cmds:
      - task: test:scripts
      - task: test:unit
      - task: test:coverage
      - task: test:accept

  test:accept:
    desc: The acceptance suite as one cached Bazel test — `bazel test //test:acceptance`
    summary: |
      C-008. One `sh_test` running `pytest -n auto` against the Bazel-built
      ocx-mirror, the ocx.lock-pinned ocx and the external/ocx Sigstore stack
      (test/BUILD.bazel carries the tags, inputs and inherited environment).
      The result is remote-cacheable, so the suite takes none of its knobs
      from this shell: registries at their defaults, the Sigstore stack as
      its own compose project on fixed ports (test/bazel_accept.sh). For
      other registries or the sibling ../ocx stack, run `task test:parallel`.

      The per-case pytest JUnit (the runner's `--junit-xml=$XML_OUTPUT_FILE`)
      is copied out of `bazel-testlogs` — a symlink into the output base — to
      target/bazel/accept/junit.xml, where a CI upload reads a real path (ocx's
      `test:accept` copies into the same target/bazel/accept/, one report per
      module). Removed first, so a run that
      never reached the test leaves no earlier run's report behind it; exit =
      Bazel's.
    dir: '{{.ROOT_DIR}}'
    platforms: [linux]
    vars:
      JUNIT: '{{.ROOT_DIR}}/target/bazel/accept/junit.xml'
    cmds:
      - task: bootstrap
      - cmd: |
          rm -f '{{.JUNIT}}'
          status=0
          {{.BAZEL}} test --jobs={{.JOBS}} //test:acceptance {{.CLI_ARGS}} || status=$?
          # 0 passed, 3 a test failed: both ran the suite and wrote its report.
          # Any other code (build failure, interrupt) may leave a stale one.
          if [ "$status" = 0 ] || [ "$status" = 3 ]; then
            mkdir -p "$(dirname '{{.JUNIT}}')"
            cp -L bazel-testlogs/test/acceptance/test.xml '{{.JUNIT}}' || echo 'bazel test:accept: no test.xml under bazel-testlogs/test/acceptance - nothing to publish' >&2
          fi
          exit "$status"

  test:scripts:
    desc: The gate-script proofs as cached Bazel tests — `bazel test //scripts/...` (TARGETS= narrows)
    summary: |
      scripts/BUILD.bazel: each gate script's `--self-test`, the
      bazel-cache-rc action's selftest.sh, and the telemetry names/never-fail
      pytest, over the hermetic interpreter and the hashed
      scripts/requirements.lock. `task scripts:self-test` and
      `task telemetry:self-test` are this on Linux. A target of its own, not
      part of `test:unit`: `bazel_test_floor.py` floors libtest case counts,
      and these are no libtest targets.
    dir: '{{.ROOT_DIR}}'
    platforms: [linux]
    vars:
      TARGETS: '{{.TARGETS | default "//scripts/..."}}'
    cmds:
      # The root package these targets read exports from loads @crates.
      - task: bootstrap
      - '{{.BAZEL}} test --jobs={{.JOBS}} {{.TARGETS}} {{.CLI_ARGS}}'

  test:unit:
    desc: Unit tests under Bazel (`//crates/... //:all`), floored per target and reported per case in target/bazel/junit.xml
    summary: |
      C-006, ocx's `test:unit` shape. The BEP holds the whole client
      environment, so it lives in a 0700 `mktemp -d` outside the checkout
      (`bep:mode`), 0600 once written, removed by the `defer` armed first.

      `scripts/bazel_test_floor.py` reads each target's `test.log` off the BEP:
      per-target case count == libtest `test result:` total, every target at
      or above its `crates/TEST_TARGET_MAP.toml` count, and a per-case JUnit
      at target/bazel/junit.xml (classname = label, name = libtest path,
      failure = panic block). Its `--self-test` is `task scripts:self-test`'s
      (verify phase 1).

      Exit = Bazel's, unless the floor has a finding. `FLOOR_ARGS=--update`
      rewrites the map's `[[target]]` rows from this run (counts rise only).
    dir: '{{.ROOT_DIR}}'
    platforms: [linux]
    vars:
      BEP_DIR:
        sh: mktemp -d -t ocx-mirror-test-bep.XXXXXXXX
      BEP: '{{.BEP_DIR}}/test-bep.json'
      JUNIT: '{{.ROOT_DIR}}/target/bazel/junit.xml'
    cmds:
      - defer: rm -rf '{{.BEP_DIR}}'
      - task: bep:mode
        vars: {DIR: '{{.BEP_DIR}}'}
      - task: bootstrap
      - cmd: |
          status=0
          {{.BAZEL}} test --jobs={{.JOBS}} //crates/... //:all \
            --build_event_json_file='{{.BEP}}' {{.CLI_ARGS}} || status=$?
          if [ ! -s '{{.BEP}}' ]; then
            echo 'bazel test:unit: --build_event_json_file wrote nothing to {{.BEP}} - the floor has no subject. Restore the flag on the run above.' >&2
            exit 1
          fi
          chmod 600 '{{.BEP}}'
          python3 scripts/bazel_test_floor.py --bep '{{.BEP}}' --junit '{{.JUNIT}}' {{.FLOOR_ARGS}} || exit $?
          exit "$status"

  test:coverage:
    desc: C4 coverage gate — Bazel-executed cases ⊇ `cargo nextest list`
    summary: |
      C-009. Runs `bazel test //crates/... //:all` with a BEP (a cache replay
      on an unchanged tree), then `cargo nextest list --workspace --release
      --locked` — sequentially: cargo and Bazel never build at once. Red on
      any case nextest names that no Bazel target executed (the names are
      printed): nothing else runs a case a target skips, so there is no
      exclusion list, and crates/TEST_TARGET_MAP.toml carrying one reds too.
    dir: '{{.ROOT_DIR}}'
    platforms: [linux]
    vars:
      BEP_DIR:
        sh: mktemp -d -t ocx-mirror-cov-bep.XXXXXXXX
      BEP: '{{.BEP_DIR}}/test-bep.json'
      LISTING: '{{.BEP_DIR}}/nextest-list.json'
    cmds:
      - defer: rm -rf '{{.BEP_DIR}}'
      - task: bep:mode
        vars: {DIR: '{{.BEP_DIR}}'}
      - task: :rust:install:nextest
      - task: bootstrap
      - cmd: |
          set -e
          {{.BAZEL}} test --jobs={{.JOBS}} //crates/... //:all --build_event_json_file='{{.BEP}}' {{.CLI_ARGS}}
          chmod 600 '{{.BEP}}'
      - cargo nextest list --workspace --release --locked --features ocx_mirror/__testing --message-format json > '{{.LISTING}}'
      - python3 scripts/bazel_test_floor.py --bep '{{.BEP}}' --coverage '{{.LISTING}}'

  test:scoped:
    desc: Test only what the change reaches — changed files vs BASE (default origin/main) → `rdeps` → `bazel test`
    summary: |
      C-010. Changed = `git diff --name-only $(git merge-base BASE HEAD)`
      (committed and working-tree) plus untracked files.

        escalate   MODULE.bazel(.lock), .bazelversion, .bazelrc, .bazelignore,
                   Cargo.lock, any Cargo.toml or BUILD.bazel, external/ocx → `bazel:test`
        test/**    `//test:acceptance`
        otherwise  each file as a label of its owning package (a deleted
                   file: that package's `:all`); files that are no target —
                   docs, .github, anything no rule reads — are dropped by a
                   `--keep_going` resolve, then
                   `kind(test, rdeps(//..., set(<labels>)))`

      `scripts/bazel_scoped.py` decides (its `--self-test` is
      `task scripts:self-test`'s). The selection is written to
      target/bazel/scoped-targets.txt. An empty one prints "nothing to test"
      and exits 0; an escalation re-enters `bazel:test` with JOBS and
      CLI_ARGS.
    dir: '{{.ROOT_DIR}}'
    vars:
      BASE: '{{.BASE | default "origin/main"}}'
      TARGETS: '{{.ROOT_DIR}}/target/bazel/scoped-targets.txt'
    cmds:
      - task: bootstrap
      - mkdir -p '{{.ROOT_DIR}}/target/bazel'
      - silent: true
        cmd: |
          python3 scripts/bazel_scoped.py --base '{{.BASE}}' --out '{{.TARGETS}}' --bazel '{{.BAZEL}}'
      - cmd: |
          selected=$(cat '{{.TARGETS}}')
          case "$selected" in
            ESCALATE) exec '{{.TASK_EXE}}' --dir '{{.ROOT_DIR}}' bazel:test JOBS='{{.JOBS}}' -- {{.CLI_ARGS}} ;;
            '') echo 'bazel test:scoped: the change reaches no Bazel test target - nothing to test'; exit 0 ;;
          esac
          {{.BAZEL}} test --jobs={{.JOBS}} $selected {{.CLI_ARGS}}

  cache:check:
    desc: Re-run the test targets on an unchanged tree; red unless every result was served from a cache
    summary: |
      C-007. `scripts/bazel_cache_check.py` decides: cached iff `cachedLocally`
      or `executionInfo.strategy` names a cache hit — never `cachedRemotely`
      alone. Run it after a green `bazel:test` with no edit in between; a
      red names the target that executed again (an undeclared input).
    dir: '{{.ROOT_DIR}}'
    platforms: [linux]
    vars:
      BEP_DIR:
        sh: mktemp -d -t ocx-mirror-cache-bep.XXXXXXXX
      BEP: '{{.BEP_DIR}}/test-bep.json'
    cmds:
      - defer: rm -rf '{{.BEP_DIR}}'
      - task: bep:mode
        vars: {DIR: '{{.BEP_DIR}}'}
      - python3 scripts/bazel_cache_check.py --self-test
      - task: bootstrap
      - cmd: |
          set -e
          {{.BAZEL}} test --jobs={{.JOBS}} //crates/... //:all //scripts/... //test:acceptance --build_event_json_file='{{.BEP}}' {{.CLI_ARGS}}
          chmod 600 '{{.BEP}}'
      - python3 scripts/bazel_cache_check.py --bep '{{.BEP}}'

  cache:rc:check:
    desc: The CI cache credential reaches Bazel — `{{.BAZEL}}` carries `--bazelrc` whenever $RUNNER_TEMP/bazel-cache.rc exists
    summary: |
      Bazel treats a refused cache as a WARNING (`Remote Cache: 401
      Unauthorized`) and builds on, so a credential that never reaches the
      command line is a silent cold build — and, on the `main` push, a write
      lane that uploads nothing. That happened: a variable name docs.taskfile.yml
      also declared made go-task 3.53 render this file's `{{.BAZEL}}` without
      its `CACHE_RC`. basic-repo.yml runs this right after writing the credential.
    cmd: |
      if [ -f "${RUNNER_TEMP:-/nonexistent}/bazel-cache.rc" ]; then
        case '{{.BAZEL}}' in
          *--bazelrc=*) echo 'bazel cache:rc:check: the credential rc reaches {{"{{"}}.BAZEL{{"}}"}}' ;;
          *) echo "bazel cache:rc:check: \$RUNNER_TEMP/bazel-cache.rc exists but the Bazel command line lacks --bazelrc: '{{.BAZEL}}'" >&2; exit 1 ;;
        esac
      fi

  pin:check:
    desc: Pin twins agree — .bazelversion vs ocx.toml's bazel tag, MODULE.bazel's `toolchains.toolchain(version=...)` vs rust-toolchain.toml, MODULE.bazel version vs the workspace version
    silent: true
    dir: '{{.ROOT_DIR}}'
    cmd: |
      python3 - <<'EOF'
      import re, sys, tomllib
      from pathlib import Path
      module = Path("MODULE.bazel").read_text()
      bazelversion = Path(".bazelversion").read_text().strip()
      ocx_tag = tomllib.loads(Path("ocx.toml").read_text())["tools"]["bazel"].rsplit(":", 1)[1]
      channel = tomllib.loads(Path("rust-toolchain.toml").read_text())["toolchain"]["channel"]
      workspace = tomllib.loads(Path("Cargo.toml").read_text())["workspace"]["package"]["version"]
      # rules_rs: the one rustc is `toolchains.toolchain(version = ...)`; a
      # second spelling elsewhere would compile the release binaries with a
      # toolchain no test lane runs.
      rust = sorted(set(re.findall(r'toolchains\.toolchain\([^)]*?version\s*=\s*"([^"]+)"', module, re.S)))
      mod = re.search(r'module\([^)]*version\s*=\s*"([^"]+)"', module, re.S)
      pairs = [
          (".bazelversion", bazelversion, "ocx.toml bazel tag", ocx_tag),
          ("MODULE.bazel toolchains.toolchain version", ", ".join(rust), "rust-toolchain.toml channel", channel),
          ("MODULE.bazel module version", mod and mod.group(1), "Cargo.toml [workspace.package] version", workspace),
      ]
      bad = [f"bazel:pin:check: {a} = {x!r} but {b} = {y!r}" for a, x, b, y in pairs if x != y]
      print("\n".join(bad) or "bazel:pin:check: 3 pin pairs agree", file=sys.stderr if bad else sys.stdout)
      sys.exit(1 if bad else 0)
      EOF

  patch:check:
    desc: The [patch.crates-io] forks bind, in both graphs — cargo's Cargo.toml + Cargo.lock and Bazel's `@crates` — for oci-client, docker_credential, sigstore
    summary: |
      ADR Q2. Nothing in MODULE.bazel names the forks; rules_rs reads the Cargo
      patch table. Dropping that table does not error — the resolve falls back
      to the crates.io releases — so this asserts the binding in both graphs.

      Cargo half: Cargo.toml's `[patch.crates-io]` row points at
      external/ocx/external/<fork>, and Cargo.lock holds exactly one entry of
      each fork, with no `source` (cargo records none for a path package; a
      registry resolve would record `registry+…`).

      Bazel half: each fork's `@crates//:<fork>-<version>` alias is queried,
      its `actual` repo is the one rules_rs generates, and that repo's
      Cargo.toml is a symlink that must resolve into
      <FORK_ROOT>/<fork>/ — the in-tree submodule path, not a crates.io
      download.

      `CARGO_TOML=`, `CARGO_LOCK=`, `FORK_ROOT=` check other inputs (red proofs).
    silent: true
    dir: '{{.ROOT_DIR}}'
    vars:
      CARGO_TOML: '{{.CARGO_TOML | default "Cargo.toml"}}'
      CARGO_LOCK: '{{.CARGO_LOCK | default "Cargo.lock"}}'
      FORK_ROOT: '{{.FORK_ROOT | default "external/ocx/external"}}'
    cmds:
      - task: bootstrap
      - cmd: |
          python3 - '{{.CARGO_TOML}}' '{{.CARGO_LOCK}}' '{{.FORK_ROOT}}' '{{.BAZEL}}' <<'EOF'
          import os, re, shlex, subprocess, sys, tomllib
          from pathlib import Path
          cargo_toml, cargo_lock, fork_root = sys.argv[1:4]
          bazel = shlex.split(sys.argv[4])
          def bz(*args):
              return subprocess.run([*bazel, *args], check=True, capture_output=True, text=True).stdout
          forks = {"oci-client": "rust-oci-client", "docker_credential": "docker_credential", "sigstore": "sigstore-rs"}
          patch = tomllib.load(open(cargo_toml, "rb")).get("patch", {}).get("crates-io", {})
          locked = tomllib.load(open(cargo_lock, "rb")).get("package", [])
          bad = []
          for name, fork in forks.items():
              row = patch.get(name, {}).get("path")
              if row != "external/ocx/external/" + fork:
                  bad.append(f"{cargo_toml} [patch.crates-io] {name} = {row!r}, expected path external/ocx/external/{fork}")
              entries = [e for e in locked if e.get("name") == name]
              if len(entries) != 1 or "source" in entries[0]:
                  bad.append(f"{cargo_lock} {name}: {[e.get('source', 'path') for e in entries]}, expected exactly one path entry (no `source`) - cargo does not resolve the fork")
          base = Path(bz("info", "output_base").strip())
          query = bz("query", 'attr(name, "^(oci-client|docker_credential|sigstore)-[0-9]", @crates//:all)', "--output=build")
          aliases = dict(re.findall(r'name = "([^"]+)",\s+visibility = \[[^\]]*\],\s+actual = "@@([^/]+)//:', query))
          for name, fork in forks.items():
              hits = {k: v for k, v in aliases.items() if re.fullmatch(re.escape(name) + r"-[0-9][^ ]*", k)}
              if len(hits) != 1:
                  bad.append(f"@crates {name}: {len(hits)} aliases, expected exactly 1: {sorted(hits)}")
                  continue
              (key, repo), = hits.items()
              manifest = base / "external" / repo / "Cargo.toml"
              real = os.path.realpath(manifest)
              want = os.path.join(os.getcwd(), fork_root, fork, "Cargo.toml")
              if real != os.path.realpath(want):
                  bad.append(f"@crates//:{key}: {manifest} resolves to {real}, expected {want} - the patch table no longer binds in Bazel")
          for line in bad:
              print(f"bazel:patch:check: {line}", file=sys.stderr)
          if not bad:
              print(f"bazel:patch:check: {', '.join(forks)} bind to {fork_root}/* in Cargo.toml, Cargo.lock and @crates")
          sys.exit(1 if bad else 0)
          EOF

  build:drift:
    desc: Every Cargo dep edge has a BUILD twin and back; every rust `version` attr equals the workspace version; every Cargo-tested target has a rust_test; no unmirrored first-party default feature or build.rs
    dir: '{{.ROOT_DIR}}'
    cmds:
      - task: bootstrap
      # `cargo metadata --locked` runs with the cargo on PATH (rust-toolchain.toml
      # pins it), as ocx's gate does.
      - python3 scripts/bazel_build_drift.py --bazel '{{.BAZEL}}'

  tag:guard:
    desc: Every test stays remotely cacheable and honestly keyed — no cache-suppressing tag, acceptance's inputs declared, no stray env_inherit, no volatile .bazelrc flag
    summary: |
      `scripts/bazel_tag_guard.py` (adapted from ocx's) over two queries:
      `tests(//...)` for tags and `env_inherit`, `deps(//test:acceptance)` for
      its input closure; plus the checked-in .bazelrc. Its `--self-test` is
      `task scripts:self-test`'s.
    dir: '{{.ROOT_DIR}}'
    cmds:
      - task: bootstrap
      - python3 scripts/bazel_tag_guard.py --bazel '{{.BAZEL}}'

  lint:
    desc: Buildifier over every BUILD.bazel and .bzl — format diff plus lint findings, decided on the exit code
    dir: '{{.ROOT_DIR}}'
    cmds:
      # The root package loads @crates, which a fresh worktree has no lockfile for.
      - task: bootstrap
      - '{{.BAZEL}} run --jobs={{.JOBS}} //:buildifier.check'

  lint:clippy:
    desc: Clippy over every first-party Rust target, warnings denied — `cargo clippy --all-targets -- -D warnings` under Bazel
    summary: |
      `--config=clippy` (.bazelrc says what it carries and why it is a named
      config). The aspect runs on every rust target `//...` expands to — each
      library, binary and rust_test, the jsonschema variants included — and on
      no external one. Linux and CI; `rust:clippy:check` stays cargo elsewhere.
    dir: '{{.ROOT_DIR}}'
    cmds:
      - task: bootstrap
      - '{{.BAZEL}} build --jobs={{.JOBS}} --config=clippy //... {{.CLI_ARGS}}'

  lint:fmt:
    desc: rustfmt --check over every tracked first-party `.rs`, against rustfmt.toml — `cargo fmt --check` under Bazel
    summary: |
      `--config=rustfmt`: one cached Rustfmt action per target, compiling
      nothing. `//:build_script_fmt` is named because `manual` keeps it out of
      `//...` — it is build.rs, the one tracked `.rs` no target compiles.
      Unlike `cargo fmt --all`, it never reaches the path dependencies under
      external/ocx. The fixer stays `task rust:format:apply`.
    dir: '{{.ROOT_DIR}}'
    cmds:
      - task: bootstrap
      - '{{.BAZEL}} build --jobs={{.JOBS}} --config=rustfmt //... //:build_script_fmt {{.CLI_ARGS}}'

  build:jsonschema:
    desc: Compile the `jsonschema` feature graph (`//:jsonschema`) — `cargo check --features jsonschema --all-targets` under Bazel
    dir: '{{.ROOT_DIR}}'
    cmds:
      - task: bootstrap
      - '{{.BAZEL}} build --jobs={{.JOBS}} //:jsonschema {{.CLI_ARGS}}'

  mod:check:
    desc: MODULE.bazel.lock is fresh — `bazel mod deps --lockfile_mode=error`
    dir: '{{.ROOT_DIR}}'
    cmds:
      - task: bootstrap
      - '{{.BAZEL}} mod deps --lockfile_mode=error'

  cache:gc:
    desc: Delete the Bazel disk cache when it exceeds MAX_GB (default 30) — manual, never in a gate
    summary: |
      Bazel 9.2.0's own disk-cache GC stays off (TOCTOU, bazel#30836, fixed in
      9.3.0). Another worktree's server may be using the cache, so this is a
      command you choose to run. `CACHE_DIR` defaults to the .bazelrc path.
    silent: true
    vars:
      CACHE_DIR: '{{.CACHE_DIR | default (printf "%s/.cache/ocx-mirror/bazel-disk" (env "HOME"))}}'
      MAX_GB: '{{.MAX_GB | default "30"}}'
    cmd: |
      set -euo pipefail
      d='{{.CACHE_DIR}}'; max='{{.MAX_GB}}'
      case "$max" in ''|*[!0-9]*) echo "bazel:cache:gc: MAX_GB must be a whole number, got '$max'" >&2; exit 1 ;; esac
      size() { if [ -d "$d" ]; then { du -sk "$d" 2>/dev/null || true; } | cut -f1; else echo 0; fi; }  # du exits 1 on a file another server removed mid-walk
      before=$(size)
      echo "bazel:cache:gc: before $((before / 1024)) MiB in $d (cap ${max} GiB)"
      if [ "$before" -gt $((max * 1024 * 1024)) ]; then
        {{.BAZEL}} shutdown
        rm -rf "$d"
      fi
      echo "bazel:cache:gc: after $(( $(size) / 1024 )) MiB"
