# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

tasks:
  # Install cargo-edit (provides cargo set-version) if not already present.
  install:cargo-edit:
    internal: true
    cmds:
      - cargo install --locked cargo-edit
    status:
      - cargo set-version --version

  # Regenerate CHANGELOG.md from the full git history.
  changelog:
    desc: Update CHANGELOG.md from git history
    cmds:
      - git-cliff --output CHANGELOG.md

  # Show what would go into the next release's changelog section.
  changelog:preview:
    desc: Preview unreleased changes
    cmds:
      - git-cliff --unreleased

  # C6.5 guard (adr_bazel_crate_split.md § C6.5, C8): a release ships against
  # an ocx that has itself been released. The committed external/ocx pointer
  # must be contained in some ocx tag; a pointer on an unreleased branch head
  # (or a commit ocx never published) is exit 1, naming the SHA. Tags are
  # fetched first — a stale local tag list would red a pointer that ocx has
  # since released, and a fetch that fails reds too (unverified is not green).
  # A tag counts only while origin serves it at the same object: `fetch --tags`
  # never deletes a local tag, so a tag made (or moved) here and never pushed
  # would otherwise pass.
  guard:ocx-released:
    desc: The committed external/ocx pointer is contained in a released ocx tag (C6.5)
    silent: true
    dir: '{{.ROOT_DIR}}'
    cmd: |
      set -euo pipefail
      root=$(git rev-parse --show-toplevel)
      ocx="$root/external/ocx"
      ptr=$(git -C "$root" rev-parse HEAD:external/ocx)
      git -C "$ocx" fetch --quiet --tags origin
      if ! git -C "$ocx" cat-file -e "$ptr^{commit}" 2>/dev/null; then
        echo "release: external/ocx pointer $ptr is not a commit in ocx's fetched history - bump the submodule to a released ocx tag first" >&2
        exit 1
      fi
      remote=$(git -C "$ocx" ls-remote --tags origin)
      # Captured first: a `$(…)` in the `for` list swallows git's exit status.
      contains=$(git -C "$ocx" tag --contains "$ptr")
      tags=
      for t in $contains; do
        ref=$(printf '%s\trefs/tags/%s' "$(git -C "$ocx" rev-parse "refs/tags/$t")" "$t")
        if grep -qxF -- "$ref" <<<"$remote"; then tags="${tags:+$tags }$t"; fi
      done
      if [ -z "$tags" ]; then
        echo "release: external/ocx pointer $ptr is in no ocx tag published on origin - release ocx (or bump the submodule to a tagged commit) before releasing ocx-mirror; a local-only tag does not count" >&2
        exit 1
      fi
      echo "release: external/ocx pointer $ptr is released in: $(echo "$tags" | cut -d' ' -f1-3)"

  # Bazel twins of the workspace version (adr_bazel_crate_split.md § C8):
  # MODULE.bazel's module() version and every rust rule's `version` attr in the
  # root and crates/* BUILD files. `bazel:pin:check` and `bazel:build:drift`
  # compare them to Cargo.toml's [workspace.package] version, so they move in
  # the same step as `cargo set-version`. MODULE.bazel.lock is refreshed after,
  # behind a bootstrap: `cargo set-version` just made Cargo.bazel.lock.json
  # stale, and `bazel mod deps` evaluates @crates against it.
  bump:bazel:
    internal: true
    dir: '{{.ROOT_DIR}}'
    requires:
      vars: [VERSION]
    cmds:
      - cmd: |
          python3 - '{{.VERSION}}' <<'EOF'
          import re, sys
          from pathlib import Path
          version = sys.argv[1]
          module = Path("MODULE.bazel")
          text, n = re.subn(r'(module\([^)]*?version\s*=\s*")[^"]+(")', rf"\g<1>{version}\g<2>", module.read_text(), count=1, flags=re.S)
          if n != 1:
              sys.exit("release: no module(version = ...) in MODULE.bazel")
          module.write_text(text)
          for build in [Path("BUILD.bazel"), *sorted(Path("crates").glob("*/BUILD.bazel"))]:
              text, n = re.subn(r'(?m)^(\s*version = )"[^"]*"', rf'\g<1>"{version}"', build.read_text())
              if n:
                  build.write_text(text)
                  print(f"release: {build}: {n} version attr(s) -> {version}")
          EOF
      - task: :bazel:bootstrap
      - env -u OTEL_EXPORTER_OTLP_HEADERS -u OTEL_EXPORTER_OTLP_ENDPOINT ocx exec bazel -- bazel mod deps --lockfile_mode=update

  # The one check a release artifact gets before upload (build-matrix.yml runs
  # it per target; it is also the cargo-vs-Bazel parity probe). Red unless:
  # `version` prints the `--json version` version; the provenance is a real
  # build's — never the `test` placeholders — carrying the target triple it
  # was built for and, for each expectation passed in, exactly that value
  # (CHANNEL, VERSION, SHA; SHA also demands a clean tree, and a GITHUB_RUN_ID
  # in this environment demands its run URL); it links nothing but the OS — a
  # musl binary has no program interpreter and no NEEDED entry, a darwin one
  # loads only /usr/lib and /System/Library images (`otool -L`), a windows one
  # imports only API sets and DLLs the host's System32 holds (read from the PE
  # import tables, printed either way); and `ocx package create` accepts it as
  # oci-publish.yml repackages it, into a scratch directory — nothing pushed.
  # An aarch64 Linux binary on an x86_64 host runs under qemu-aarch64, an
  # x86_64 darwin one on an arm64 Mac under Rosetta; an aarch64 windows binary
  # needs an arm64 Windows host (build-matrix.yml's smoke-windows-arm64).
  smoke:
    desc: 'Smoke a release binary: BIN=<path> TARGET=<triple> [CHANNEL= VERSION= SHA=] — provenance, static linkage, `ocx package create`'
    dir: '{{.ROOT_DIR}}'
    silent: true
    requires:
      vars: [BIN, TARGET]
    cmd: |
      set -euo pipefail
      bin='{{.BIN}}'
      run=("$bin")
      case '{{.TARGET}}' in
        aarch64-*-linux-*) [ "$(uname -m)" = aarch64 ] || run=(qemu-aarch64 "$bin") ;;
      esac
      plain=$("${run[@]}" version)
      json=$("${run[@]}" --json version)
      echo "$json"
      python3 - "$plain" "$json" '{{.TARGET}}' '{{.CHANNEL}}' '{{.VERSION}}' '{{.SHA}}' <<'EOF'
      import json, os, sys
      plain, raw, target, channel, version, sha = sys.argv[1:]
      data = json.loads(raw)
      bad = []
      def want(what, got, expected):
          if got != expected:
              bad.append(f"{what} = {got!r}, expected {expected!r}")
      want("`version` (plain)", plain, data.get("version"))
      if data.get("channel") in (None, "test"):
          bad.append(f"channel = {data.get('channel')!r} - a test build or no channel at all, not a release build")
      want("build.target", (data.get("build") or {}).get("target"), target)
      if channel:
          want("channel", data.get("channel"), channel)
      if version:
          want("version", data.get("version"), version)
      if sha:
          want("commit.sha", (data.get("commit") or {}).get("sha"), sha)
          want("commit.dirty", (data.get("commit") or {}).get("dirty"), False)
      if os.environ.get("GITHUB_RUN_ID"):
          url = "{GITHUB_SERVER_URL}/{GITHUB_REPOSITORY}/actions/runs/{GITHUB_RUN_ID}".format(**os.environ)
          want("ci.run_url", (data.get("ci") or {}).get("run_url"), url)
      for line in bad:
          print(f"release:smoke: {line}", file=sys.stderr)
      if bad:
          sys.exit(1)
      print(f"release:smoke: {target} {data['version']} channel={data['channel']} commit={(data.get('commit') or {}).get('short')}")
      EOF
      case '{{.TARGET}}' in
        *-linux-musl)
          if readelf -lW "$bin" | grep -q INTERP || readelf -dW "$bin" | grep -q NEEDED; then
            echo "release:smoke: $bin is not static - it names a program interpreter or a NEEDED library" >&2
            exit 1
          fi ;;
        *-apple-darwin)
          otool -L "$bin"
          if otool -L "$bin" | tail -n +2 | grep -vE '^[[:space:]]+/(usr/lib|System/Library)/'; then
            echo "release:smoke: $bin loads the images above from outside /usr/lib and /System/Library" >&2
            exit 1
          fi ;;
        *-windows-*)
          python3 - "$bin" <<'EOF'
      import os, struct, sys
      data = open(sys.argv[1], "rb").read()
      pe = struct.unpack_from("<I", data, 0x3C)[0]
      count, optional = struct.unpack_from("<H12xH", data, pe + 6)
      pe32plus = struct.unpack_from("<H", data, pe + 24)[0] == 0x20B
      dirs = pe + 24 + (112 if pe32plus else 96)
      # (VirtualSize, VirtualAddress, SizeOfRawData, PointerToRawData) per section.
      sections = [struct.unpack_from("<8xIIII", data, pe + 24 + optional + 40 * i) for i in range(count)]
      def offset(rva):
          return next(raw + rva - va for size, va, rawsize, raw in sections if va <= rva < va + max(size, rawsize))
      dlls = []
      # The import table (directory 1, 20-byte descriptors, name at +12) and
      # the delay-load one (directory 13, 32-byte descriptors, name at +4).
      for index, width, name_at in ((1, 20, 12), (13, 32, 4)):
          rva = struct.unpack_from("<I", data, dirs + 8 * index)[0]
          at = offset(rva) if rva else None
          while at is not None and any(data[at:at + width]):
              name = offset(struct.unpack_from("<I", data, at + name_at)[0])
              dlls.append(data[name:data.index(b"\0", name)].decode())
              at += width
      system32 = {entry.lower() for entry in os.listdir(os.path.join(os.environ["SYSTEMROOT"], "System32"))}
      foreign = [d for d in dlls if not d.lower().startswith(("api-ms-win-", "ext-ms-")) and d.lower() not in system32]
      print("release:smoke: imports " + " ".join(sorted(dlls, key=str.lower)))
      if foreign:
          sys.exit(f"release:smoke: {sys.argv[1]} imports DLLs no System32 holds: {' '.join(foreign)}")
      EOF
          ;;
      esac
      # oci-publish.yml's PLATFORM_MAP. A `case`, not `declare -A`: go-task's
      # shell (mvdan/sh) panics on an associative-array key holding `-`.
      case '{{.TARGET}}' in
        x86_64-*-linux-*) platform=linux/amd64 ;;
        aarch64-*-linux-*) platform=linux/arm64 ;;
        x86_64-apple-darwin) platform=darwin/amd64 ;;
        aarch64-apple-darwin) platform=darwin/arm64 ;;
        x86_64-pc-windows-*) platform=windows/amd64 ;;
        aarch64-pc-windows-*) platform=windows/arm64 ;;
        *) echo "release:smoke: no OCI platform for {{.TARGET}}" >&2; exit 1 ;;
      esac
      # Under target/, not mktemp's default: on Windows that is Git Bash's
      # `/tmp`, a path the native `ocx` cannot resolve.
      mkdir -p '{{.ROOT_DIR}}/target'
      work=$(mktemp -d '{{.ROOT_DIR}}/target/release-smoke.XXXXXX')
      trap 'rm -rf "$work"' EXIT
      ext=; case '{{.TARGET}}' in *windows*) ext=.exe ;; esac
      mkdir -p "$work/repackage/bin"
      install -m 0755 "$bin" "$work/repackage/bin/ocx-mirror$ext"
      ocx package create "$work/repackage" -m packaging/metadata.json -o "$work/ocx-mirror.tar.xz" -p "$platform"
      echo "release:smoke: ocx package create accepted it ($(du -h "$work/ocx-mirror.tar.xz" | cut -f1) archive)"

  # Full release preparation: compute next version, update Cargo.toml + CHANGELOG, run verify.
  # After this task succeeds, the human reviews and commits.
  #
  # Version selection:
  #   task release:prepare                 # interactive menu: auto | patch | minor | major
  #   task release:prepare BUMP=minor      # skip the menu, force a bump level
  #   task release:prepare BUMP=auto VERSION=1.4.0   # pin an exact version (v prefix optional)
  #
  # BUMP is a required enum: with interactive mode on (.taskrc.yml) and a TTY it
  # renders a selection menu; on CI / no TTY it must be passed on the CLI.
  prepare:
    desc: 'Prepare a release (interactive: pick auto|patch|minor|major; or BUMP=<level> / VERSION=x.y.z)'
    deps:
      - install:cargo-edit
    requires:
      vars:
        - name: BUMP
          enum: [auto, patch, minor, major]
    vars:
      # git-cliff computes the next version from git history. `auto` lets it pick
      # the bump from conventional commits; otherwise BUMP forces the level.
      # VERSION pins an exact value and wins over BUMP.
      NEXT_VERSION:
        sh: |
          if [ -n "{{.VERSION}}" ]; then
            printf 'v%s' "{{.VERSION | default "" | trimPrefix "v"}}"
          elif [ "{{.BUMP}}" = "auto" ]; then
            git-cliff --bumped-version
          else
            git-cliff --bumped-version --bump "{{.BUMP}}"
          fi
    cmds:
      - task: guard:ocx-released
      - echo "Next version:{{.NEXT_VERSION}}"
      - cargo set-version "{{.NEXT_VERSION | trimPrefix "v"}}"
      - task: bump:bazel
        vars: {VERSION: '{{.NEXT_VERSION | trimPrefix "v"}}'}
      - git-cliff --tag "{{.NEXT_VERSION}}" -o CHANGELOG.md
      - task verify
      - |
        echo ""
        echo "Release prepared ({{.NEXT_VERSION}}). Review changes, then:"
        echo "  git add -A && git commit -m 'release: {{.NEXT_VERSION}}'"
        echo "  git tag {{.NEXT_VERSION}}"
        echo "  git push --atomic origin main {{.NEXT_VERSION}}"
