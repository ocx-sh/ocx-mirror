[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
version = 2
yanked = "warn"
# Empty on purpose. The three RUSTSEC ignores that lived here (2024-0388
# derivative, 2024-0436 paste, 2025-0057 fxhash) were all starlark-family
# transitives, and starlark reached this binary only through the `ocx` CLI
# crate. That row is gone, and so are they.
ignore = []

[licenses]
allow = [
  "Apache-2.0",
  "MIT",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "MIT-0",
  "Zlib",
  "EPL-2.0",
  # Required transitively by dirs-sys → option-ext.
  "MPL-2.0",
  # libbz2-rs-sys, the pure-Rust bzip2 decoder `ocx_util::archive` reads
  # `.tar.bz2` upstream assets with (ocx 0.6.2). Permissive, BSD-like.
  "bzip2-1.0.6",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "allow"
