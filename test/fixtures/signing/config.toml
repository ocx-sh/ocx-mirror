# Verification-side config for the mirror-signing harness (WP 5, C-073).
#
# One instance table: the local Sigstore stack, which `ocx package verify
# --sigstore <authority>` reads. There is deliberately no public-instance table
# and no decoy Rekor URL: ocx resolves the public instance for a key-mode verify
# too, so a decoy there fails every key verify. The mirror's PUBLISH side (the
# sign.keyless.fulcio/.rekor refs in mirror.yml, resolved by the mirror itself
# per adr_mirror_signing.md D1, S-061) needs none: a publish that dropped those
# flags would sign against the public Fulcio and fail on the local identity
# token. `trusted_root` is a bare path with no scheme
# (adr_key_reference_grammar.md), resolved relative to this file's own
# directory at load time.
#
# `trusted_root` is the literal placeholder `__TRUSTED_ROOT_PATH__` --
# swapped by the fixture at runtime (mirroring the `__IDENTITY_TOKEN_PATH__`
# convention in mirror.yml) for the resolved sibling checkout's
# `test/sigstore/trusted_root.json`, generated by
# `../ocx/test/sigstore/generate-trusted-root.py` from ocx's committed test
# CA keys. A relative path baked in at commit time cannot survive both a
# plain checkout and an agent worktree, where the sibling `../ocx` is two
# levels further up (`src.helpers.main_checkout_root`).
#
# The other three placeholders below are swapped by `render_signing_fixture` from the
# stack's own Fulcio URL: the table key is that URL's host[:port], and a table's
# `fulcio_url` has to match its key.
[sigstore."__SIGSTORE_AUTHORITY__"]
trusted_root = "__TRUSTED_ROOT_PATH__"
fulcio_url = "__FULCIO_URL__"
rekor_url = "__REKOR_URL__"
