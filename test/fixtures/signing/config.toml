# Verification-side config for the mirror-signing harness (WP 5, C-073).
#
# Deliberately carries ONLY [trust.sigstore].trusted_root -- no rekor
# override -- so the harness can assert the mirror's PUBLISH side (the
# sign.keyless.fulcio/.rekor refs in mirror.yml, resolved by the mirror
# itself per adr_mirror_signing.md D1) never reads this file's endpoints
# (S-061). `trusted_root` is a bare path with no scheme
# (adr_key_reference_grammar.md), resolved relative to this file's own
# directory at load time.
#
# `trusted_root` is the literal placeholder `__TRUSTED_ROOT_PATH__` --
# swapped by the fixture at runtime (mirroring the `__IDENTITY_TOKEN_PATH__`
# convention in mirror.yml) for the resolved sibling checkout's
# `test/sigstore/trusted_root.json`, generated by
# `../ocx/test/sigstore/generate-trusted-root.py` from ocx's committed test
# CA keys. A relative path baked in at commit time cannot survive both a
# plain checkout and an agent worktree, where the sibling `../ocx` is two
# levels further up (`src.helpers.main_checkout_root`).
[trust.sigstore]
trusted_root = "__TRUSTED_ROOT_PATH__"

# Decoy: verify never dials Fulcio, only reads the trusted-root bundle
# above. An invalid host here is what lets S-061 assert the publish leg
# ignores this file's endpoints entirely -- a publish that fell through to
# this config would fail loudly (DNS/connect error) rather than silently
# succeeding against the real ocx sigstore stack.
fulcio_url = "https://fulcio.invalid"
