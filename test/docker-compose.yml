# Dedicated project name and host port: sibling repos' compose projects
# default to `test`, and the harness would silently reuse whatever answers
# there. The session's zot registries are not here -- `src/zot.py` starts
# them; this file holds only registry:2, which keeps untagged manifests and
# answers 404 on the Referrers API (the `legacy_registry` fixture).
name: ocx-mirror-test

services:
  legacy_registry:
    image: registry:2
    ports:
      - "${OCX_TEST_LEGACY_PORT:-5001}:5000"
