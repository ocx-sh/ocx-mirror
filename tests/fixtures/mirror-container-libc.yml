# Mirror spec whose platform keys carry a libc `os.features` claim.
#
# This is the shape the container matrix exists for: the same os/arch mirrored
# twice, once musl-linked and once glibc-linked, each tested inside an image
# running that libc. Without it an `os.features` claim is published untested.
name: shfmt
target:
  registry: ocx.sh
  repository: shfmt

source:
  type: github_release
  owner: mvdan
  repo: sh
  tag_pattern: "^v(?P<version>\\d+\\.\\d+\\.\\d+)$"

assets:
  "linux/amd64+libc.musl":
    - "shfmt_v.*_linux_amd64$"
  "linux/amd64+libc.glibc":
    - "shfmt_v.*_linux_amd64$"

asset_type:
  type: binary
  name: shfmt

skip_prereleases: true
cascade: true
build_timestamp: none

tests:
  - name: version
    command: shfmt --version

platforms:
  # musl claim, verified under a musl userland.
  "linux/amd64+libc.musl":
    runner: ubuntu-latest
    containers:
      - image: alpine:3.20
  # glibc claim, verified under a glibc userland.
  "linux/amd64+libc.glibc":
    runner: ubuntu-latest
    containers:
      - image: ubuntu:24.04

ocx_mirror:
  release_tag: v0.7.2
