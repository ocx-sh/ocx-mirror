# Mirror spec whose platforms name a runner as a label *set* rather than a
# single label — the forge-neutral spelling of issue #77.
#
# Native-only, so it joins the golden corpus: this fixture is what proves a
# multi-label `runner:` renders as a YAML flow sequence, while every other
# golden proves the single-label spelling still renders as the bare scalar it
# always did.
name: shfmt
target:
  registry: ocx.sh
  repository: shfmt

source:
  type: github_release
  owner: mvdan
  repo: sh
  tag_pattern: "^v(?P<version>\\d+\\.\\d+\\.\\d+)$"

assets:
  linux/amd64:
    - "shfmt_v.*_linux_amd64$"
  linux/arm64:
    - "shfmt_v.*_linux_arm64$"

asset_type:
  type: binary
  name: shfmt

skip_prereleases: true
cascade: true
build_timestamp: none

tests:
  - name: version
    command: shfmt --version

platforms:
  # The label set: the job runs on a runner carrying all three.
  linux/amd64:
    runner: [self-hosted, linux, x64]
  # The single-label spelling, unchanged, beside it in one workflow.
  linux/arm64:
    runner: ubuntu-24.04-arm
