# The tools `release.yml` and `backfill.yml` run. A separate project so its v4 lock never
# touches the root `ocx.lock` (template-owned CI bootstraps an ocx that reads only v3).
# The `ocx` that publishes is pinned here by build tag: a released `ocx.sh/ocx/cli:<version>_<timestamp>`,
# or a `ghcr.io/ocx-sh/dev/cli:<tag>` dev build that only `mode=dev` accepts. Then swap ocx-identity.env
# and run `ocx --project packaging/release-tools lock`.
[tools]
cargo-cyclonedx = "ocx.sh/cyclonedx/cargo-cyclonedx:0.5.9"
git-cliff = "ocx.sh/git-cliff/git-cliff:2.14.1"
ocx = "ocx.sh/ocx/cli:0.6.8_20261115222333"
