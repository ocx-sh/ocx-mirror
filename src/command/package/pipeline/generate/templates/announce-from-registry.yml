# DO NOT EDIT — re-run `ocx-mirror package pipeline generate ci` to update.
# Source: {SPEC_SOURCE}

name: announce-from-registry{WORKFLOW_SUFFIX}

# The nightly push job announces what its own run published; this one announces
# everything the registry already holds. Dispatch is always available, and
# defaults to reporting. An operator who wants the catch-up unattended opts in
# with `announce: { schedule: … }` in the spec — a scheduled run announces for
# real, and a run that finds nothing new commits nothing; it opens a pull
# request only when an earlier run stranded commits on the announce branch.
on:
{ANNOUNCE_SCHEDULE_BLOCK}  workflow_dispatch:
    inputs:
      dry_run:
        description: Report what would change without opening an index pull request
        type: boolean
        default: true

concurrency:
  # Its own group, unlike cascade.yml's: this workflow writes index pull
  # requests only, never registry tags, so concurrent announce writers contend
  # on a per-package index branch — the fast-forward path is compare-and-swap
  # with a retry, and the spent-branch reset path can drop a racing commit that
  # the next full from-registry run re-adds. Joining the publish group would
  # instead let a queued push cancel the pending catch-up. That coupling exists
  # for cascade because cascade and push re-point the same rolling aliases.
  group: mirror-${{ github.workflow }}-announce-from-registry
  cancel-in-progress: false

jobs:
  announce:
    runs-on: ubuntu-latest
{ANNOUNCE_PERMISSIONS}    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: ocx-sh/setup-ocx@de8e3366f812941423985eaccae28663ef192e8b  # v1.3.0
        with:
          version: "{OCX_CLI_VERSION}"
{REGISTRY_AUTH_STEPS}      - name: Announce every registry tag into the index
        if: ${{ steps.creds.outputs.have == 'true' }}
        env:
          # Same secret the push job carries. Absent, the announce fails
          # loudly — unlike the push job this workflow has nothing else to do.
          OCX_ANNOUNCE_TOKEN: ${{ secrets.OCX_ANNOUNCE_TOKEN }}
          # Read through the environment, never interpolated into the script.
          # `inputs.dry_run` is empty on a schedule event, which would read as
          # "not true" by accident — spell the scheduled answer out instead.
          DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "${DRY_RUN}" = "true" ]; then
            ocx-mirror package pipeline announce{SPEC_ARG} --dry-run
          else
            ocx-mirror package pipeline announce{SPEC_ARG}
          fi
