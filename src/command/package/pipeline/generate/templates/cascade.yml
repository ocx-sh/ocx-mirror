name: cascade{WORKFLOW_SUFFIX}

# Dispatch only. A cascade breaks when a push lands out of order or dies
# half-way — a state a maintainer decides to act on, never something to
# re-point published rolling tags over on a timer.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Report the repair plan without writing a tag or touching the index
        type: boolean
        default: true

concurrency:
  group: mirror-${{ github.workflow }}-cascade
  cancel-in-progress: false

jobs:
  cascade:
    runs-on: ubuntu-latest
{CASCADE_PERMISSIONS}    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: ocx-sh/setup-ocx@de8e3366f812941423985eaccae28663ef192e8b  # v1.3.0
        with:
          version: "{OCX_CLI_VERSION}"
{REGISTRY_AUTH_STEPS}      - name: Repair the rolling-tag cascade
        if: ${{ steps.creds.outputs.have == 'true' }}
        env:
          # A repaired alias points at a digest the index does not know, so a
          # run that moved anything ends by announcing. Absent, that announce
          # is recorded as skipped rather than failing a run whose tags already
          # landed — the same degradation the push job has.
          OCX_ANNOUNCE_TOKEN: ${{ secrets.OCX_ANNOUNCE_TOKEN }}
          # Read through the environment, never interpolated into the script.
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "${DRY_RUN}" = "true" ]; then
            ocx-mirror package pipeline cascade{SPEC_ARG} --dry-run
          else
            ocx-mirror package pipeline cascade{SPEC_ARG}
          fi
