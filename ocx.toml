[tools]
task = "ocx.sh/go-task/task:3.53.1"
bazel = "ocx.sh/bazelbuild/bazel:9.2.0"
git-cliff = "ocx.sh/git-cliff/git-cliff:2.14.2"
uv = "ocx.sh/astral-sh/uv:0.13.0"
lychee = "ocx.sh/lychee/lychee:0.24.2"
prek = "ocx.sh/prek/prek:0.5.5"
actionlint = "ocx.sh/actionlint/actionlint:1.7.12"
ocx = "ghcr.io/ocx-sh/dev/cli:0.6.8-pr779_20261125132518"  # pull-request build of ocx-sh/ocx#779; replace with the canary of ocx main (or the release) before this merges
zot = "ocx.sh/project-zot/zot:2.1.21"

# CI installs `default,<role>` per job and ocx rejects an undeclared group, so every role is declared.
# `ocx exec -g lint -- <tool>` composes only the named group; a pin here equals its pin in [tools].
[group.lint.tools]
prek = "ocx.sh/prek/prek:0.5.5"
gitleaks = "ocx.sh/gitleaks/gitleaks:8.30.1"
grim = "ocx.sh/grimoire/cli:0.14.3"
uv = "ocx.sh/astral-sh/uv:0.13.0"
actionlint = "ocx.sh/actionlint/actionlint:1.7.12"
lychee = "ocx.sh/lychee/lychee:0.24.2"

[group.test.tools]
uv = "ocx.sh/astral-sh/uv:0.13.0"
zot = "ocx.sh/project-zot/zot:2.1.21"

[group.build.tools]
bazelisk = "ocx.sh/bazelbuild/bazelisk:1.29.0"

[group.docs.tools]

# What `release.yml`, `backfill.yml` and `prune.yml` run (`ocx exec -g release -- <cmd>`). The `ocx` here is the one that
# publishes, pinned by build tag: a released `ocx.sh/ocx/cli:<version>_<timestamp>`, or a
# `ghcr.io/ocx-sh/dev/cli:<tag>` dev build that only `mode=dev` accepts. It differs on purpose from
# `[tools].ocx`, the test/dev CLI. When it changes, swap `.github/actions/release-ocx/ocx-identity.env`
# with it and run `ocx lock`. `prune.yml` needs `package prune --forge` and `package announce --ephemeral` from
# this `ocx` (verified present at tag v0.6.8).
[group.release.tools]
cargo-cyclonedx = "ocx.sh/cyclonedx/cargo-cyclonedx:0.5.9"
git-cliff = "ocx.sh/git-cliff/git-cliff:2.14.2"
ocx = "ocx.sh/ocx/cli:0.6.8_20261115222333"
